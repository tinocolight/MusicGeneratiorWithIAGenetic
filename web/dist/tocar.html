ture.keyCentred":{pt:"Centralidade tonal",en:"Tonal centrality"},"feature.nonScale":{pt:"Notas fora da escala",en:"Notes outside the scale"},"feature.dissonantIntervals":{pt:"Intervalos dissonantes",en:"Dissonant intervals"},"feature.contourDirection":{pt:"Dire\xE7\xE3o do contorno",en:"Contour direction"},"feature.contourStability":{pt:"Estabilidade do contorno",en:"Contour stability"},"feature.stepMovement":{pt:"Movimento por grau",en:"Stepwise motion"},"feature.leapReturns":{pt:"Retorno ap\xF3s salto",en:"Return after a leap"},"feature.climaxStrength":{pt:"For\xE7a do cl\xEDmax",en:"Climax strength"},"feature.repeatedPitch":{pt:"Notas repetidas",en:"Repeated notes"},"feature.meanAbsInterval":{pt:"Intervalo m\xE9dio",en:"Mean interval"},"feature.noteDensity":{pt:"Notas por tempo",en:"Notes per beat"},"feature.restRatio":{pt:"Propor\xE7\xE3o de pausas",en:"Share of rests"},"feature.rhythmicVariety":{pt:"Variedade r\xEDtmica",en:"Rhythmic variety"},"feature.syncopation":{pt:"S\xEDncopa",en:"Syncopation"},"feature.repeatedIntervalPatterns":{pt:"Padr\xF5es mel\xF3dicos repetidos",en:"Repeated melodic patterns"},"feature.repeatedRhythmPatterns":{pt:"Padr\xF5es r\xEDtmicos repetidos",en:"Repeated rhythmic patterns"},"feature.pcEntropy":{pt:"Entropia de classes de altura",en:"Pitch-class entropy"},"feature.intervalEntropy":{pt:"Entropia de intervalos",en:"Interval entropy"},"feature.lzComplexity":{pt:"Complexidade LZ",en:"LZ complexity"},"feature.zipfPitch":{pt:"Zipf (alturas)",en:"Zipf (pitches)"},"feature.zipfInterval":{pt:"Zipf (intervalos)",en:"Zipf (intervals)"},"feature.spectralSlope":{pt:"Declive espectral (1/f)",en:"Spectral slope (1/f)"},"feature.icPitch":{pt:"Surpresa mel\xF3dica (bits)",en:"Melodic surprise (bits)"},"feature.icRhythm":{pt:"Surpresa r\xEDtmica (bits)",en:"Rhythmic surprise (bits)"},"about.html":{pt:`
<h3>O que \xE9</h3>
<p>Uma vers\xE3o web do <em>GeneticMusic</em> (Rui Luz e Rafael Silva, IPCA 2020): um algoritmo gen\xE9tico comp\xF5e uma melodia e a aptid\xE3o inclui <strong>ondas atratoras</strong>, curvas que puxam as notas para uma bacia \xE0 sua volta. Tudo corre no navegador; a mesma semente d\xE1 sempre a mesma pe\xE7a.</p>

<h3>Dois modelos, at\xE9 tr\xEAs vozes</h3>
<ul>
<li><strong>Cl\xE1ssico</strong>: as 15 regras de <code>AlgorithmFitness.cs</code>, portadas regra a regra (validado contra o C# original compilado: 0 diferen\xE7as em 795 compara\xE7\xF5es), com os pesos do formul\xE1rio original e operadores ao n\xEDvel do bit como no GeneticSharp.</li>
<li><strong>Campo de atratores</strong>: as ondas passam a ter bacias cont\xEDnuas (a influ\xEAncia decai com a dist\xE2ncia), podem ser arcos de frase, ru\xEDdo 1/f ou atratores ca\xF3ticos, e juntam-se regras da cogni\xE7\xE3o musical (ver abaixo). Cada regra \xE9 uma m\xE9dia por nota, por isso as pausas deixaram de ser um ref\xFAgio.</li>
<li><strong>Vozes</strong>: em qualquer dos modelos a melodia pode ser tocada por 2 ou 3 vozes, cada uma com o seu instrumento, compasso de entrada e intervalo (un\xEDssono, oitavas, 5.\xAA ou 4.\xAA diat\xF3nicas), para que v\xE1rios m\xFAsicos leiam a mesma parte como nos <em>Canons m\xE9lodieux</em> de Telemann (TWV 40:118\u2013123). O contraponto entre todos os pares de vozes entra na aptid\xE3o e na popula\xE7\xE3o inicial, desde a gera\xE7\xE3o 0.</li>
</ul>
<p>Em \xABPesos das regras\xBB, o bot\xE3o \xAB?\xBB ao lado de cada peso explica o que a regra mede e como muda a melodia; no modo cl\xE1ssico, as descri\xE7\xF5es interpretam tamb\xE9m o que os autores pretendiam, a partir do c\xF3digo e dos seus coment\xE1rios.</p>

<h3>Heur\xEDsticas de composi\xE7\xE3o e estilos</h3>
<p>Uma pesquisa na literatura (66 achados com fonte, em <code>web/results/estilos/literatura.csv</code>) deu regras gerais de escrita mel\xF3dica \u2014 mais graus a descer do que a subir (Huron), in\xE9rcia do grau (Chiu &amp; Temperley), saltos compensados e, quando seguidos, s\xF3 em arpejo (Fux, Jeppesen), sem tr\xEDtonos nem s\xE9timas, um arco por frase (Huron), a nota final da frase mais longa e mais grave (Tierney, Russo &amp; Patel), motivos r\xEDtmicos repetidos (Schoenberg; Savage et al.) \u2014 e as caracter\xEDsticas de 36 estilos: can\xE7\xF5es, dan\xE7as irlandesas e escocesas, dan\xE7as barrocas, t\xF3picos cl\xE1ssicos, dan\xE7as portuguesas, fado, blues, jazz e pop. Cada regra mede uma caracter\xEDstica da melodia e compara-a com um intervalo-alvo: o P10\u2013P90 das melodias reais quando o corpus as tem (can\xE7\xF5es do Essen, corais de Bach, reels, jigs, slip jigs, hornpipes, strathspeys, marchas), sen\xE3o o valor da literatura. Nada se maximiza: dentro do intervalo a regra vale 1. O peso \xABHeur\xEDsticas de composi\xE7\xE3o\xBB junta-as na aptid\xE3o; escolher um estilo ajusta o compasso, a frase, a forma e o andamento e mant\xE9m esse peso acima de 0. Com valida\xE7\xE3o cruzada, as regras gerais p\xF5em a melodia real acima da mesma melodia com as notas baralhadas em 90 % dos pares; no algoritmo gen\xE9tico, cada estilo leva as melodias para dentro dos seus intervalos (<code>web/results/estilos.md</code>).</p>

<h3>L\xEDnguas</h3>
<p>A p\xE1gina existe em portugu\xEAs e em ingl\xEAs (menu no cabe\xE7alho). Todos os textos est\xE3o num s\xF3 ficheiro, <code>web/src/i18n/texts.js</code>, e a p\xE1gina s\xF3 tem marcadores; para acrescentar uma l\xEDngua basta junt\xE1-la \xE0 lista e traduzir as entradas.</p>

<h3>Blocos de constru\xE7\xE3o do corpus, por compasso</h3>
<p>9644 melodias reais (Essen, Aird's Airs, O'Neill, Ryan's Mammoth, Bach) foram separadas pelo compasso e cortadas em tempos: uma sem\xEDnima nos compassos simples (2/4, 3/4, 4/4), uma sem\xEDnima com ponto \u2014 tr\xEAs colcheias \u2014 nos compostos (3/8, 6/8, 9/8, 12/8). Cada tempo tem uma figura r\xEDtmica (em 6/8, sobretudo tr\xEAs colcheias ou sem\xEDnima e colcheia), um contorno em graus da escala e um intervalo de entrada. Compararam-se v\xE1rios modelos em melodias deixadas de fora (valida\xE7\xE3o cruzada): a figura seguinte prev\xEA-se melhor com as figuras anteriores \u2014 uma \xAB\xE1rvore\xBB de dois passos \xE9 melhor do que um, e at\xE9 um compasso inteiro de mem\xF3ria ainda ajuda \u2014, enquanto a dire\xE7\xE3o da \xFAltima nota (sobe ou desce, por grau ou por salto) pouco diz sobre o ritmo mas muito sobre o intervalo seguinte (depois de um salto a melodia tende a voltar para tr\xE1s). O gerador usa um modelo destes por compasso para escrever a popula\xE7\xE3o inicial, numa muta\xE7\xE3o e na regra \xABIdioma do corpus\xBB; cada regra conta s\xF3 at\xE9 ao seu valor t\xEDpico na m\xFAsica real desse compasso (\xABn\xE3o maximizar\xBB). Todas as contagens e probabilidades est\xE3o em tabelas audit\xE1veis (<code>web/results/meters/</code>, em CSV e num livro de Excel), e o painel \xABPadr\xF5es do corpus\xBB, no separador Analisar, mostra as do compasso escolhido.</p>

<h3>Partitura e LilyPond</h3>
<p>O bot\xE3o \xABPartitura\xBB mostra a pe\xE7a em nota\xE7\xE3o tradicional, uma pauta por voz, com a fonte Gonville (feita como substituta da fonte do LilyPond) e a disposi\xE7\xE3o habitual do LilyPond. \xABPDF\xBB descarrega a partitura em PDF A4 vetorial, desenhada pelo mesmo c\xF3digo. O tamanho da pauta ajusta-se para encher p\xE1ginas inteiras: se a \xFAltima p\xE1gina ficasse quase vazia, a pauta encolhe e a pe\xE7a cabe numa p\xE1gina a menos; se ficasse a meio, a pauta cresce at\xE9 a m\xFAsica ocupar as p\xE1ginas todas. Em \xABPautas\xBB escolhe-se entre uma pauta por voz e o c\xE2none numa s\xF3 linha, como se imprimem as rondas: um n\xFAmero em caixa marca onde cada voz entra (quando a 1.\xAA voz chega ao n\xFAmero 2, a 2.\xAA come\xE7a do in\xEDcio), com uma legenda do instrumento, da entrada e do intervalo de cada voz, e sinais de repeti\xE7\xE3o nas rondas. \xABLilyPond (.ly)\xBB descarrega o c\xF3digo para gravar a partitura com o pr\xF3prio LilyPond, com a mesma escolha. No modo cl\xE1ssico, as duas ondas W1 e W2 editam-se com os mesmos campos do formul\xE1rio original.</p>

<h3>Ondas edit\xE1veis e experi\xEAncias</h3>
<p>Cada onda tem tipo, frequ\xEAncia, desfasamento, valor m\xE9dio e amplitude (ou m\xEDnimo e m\xE1ximo) e uma bacia com largura e forma; pode haver at\xE9 4. As ondas da configura\xE7\xE3o aparecem a tracejado na partitura antes de gerar. Os bot\xF5es de auto-configura\xE7\xE3o sugerem ondas, forma, pesos e algoritmo a partir das vozes; cada gera\xE7\xE3o fica registada com a sua configura\xE7\xE3o, e \xABTestar 5 sementes\xBB mostra se uma mudan\xE7a ajuda de forma consistente.</p>

<h3>An\xE1lise inversa</h3>
<p>235 melodias reais completas, os seus retr\xF3grados e modelos nulos foram passados pelas regras. As regras originais d\xE3o \xE0 m\xFAsica real a mesma pontua\xE7\xE3o que ao ru\xEDdo branco (50 % dos pares); as novas separam-nas em 96 % dos pares, sobretudo pela proximidade e pelas for\xE7as mel\xF3dicas. Quase nenhuma regra distingue uma melodia do seu retr\xF3grado (52 %), e o AG leva as regras ao dobro do valor que a m\xFAsica real atinge. Os pesos aprendidos com estes dados est\xE3o dispon\xEDveis como predefini\xE7\xE3o (\xABAprendidos da m\xFAsica real\xBB). Detalhes em <code>web/results/reverse.md</code>.</p>

<h3>Combina\xE7\xF5es de partida do modo cl\xE1ssico</h3>
<p>Um estudo do algoritmo original com 3074 melodias reais (can\xE7\xF5es de Essen, reels e hornpipes, corais de Bach) fez tr\xEAs coisas. Primeiro, um desenho de experi\xEAncias (Plackett\u2013Burman, 64 ensaios, 30 valores do original): nenhum valor sozinho tira o algoritmo do cr\xEDtico 0. Depois, uma calibra\xE7\xE3o inversa: as constantes medidas na m\xFAsica real e pesos que p\xF5em a m\xFAsica real acima das suas vizinhas. Por fim, uma otimiza\xE7\xE3o por entropia cruzada, confirmada com 24 sementes novas.</p>
<p>Com os operadores de bits do original, as combina\xE7\xF5es aproximam a forma: por exemplo, o \xE2mbito passa de 36 para 14 meios-tons e as notas por tempo de 2,7 para 0,6. O cr\xEDtico, por\xE9m, continua em 0, porque as regras n\xE3o veem as s\xEDncopas nem o tamanho dos saltos. Com os operadores musicais, o cr\xEDtico fica em 0,90\u20130,92: a \xABCan\xE7\xE3o\xBB acaba na t\xF3nica em 71 % das pe\xE7as (can\xE7\xF5es reais: 73 %), a \xABDan\xE7a\xBB tem a densidade das dan\xE7as reais e o \xABCoral\xBB os graus conjuntos dos corais.</p>

<h3>O que se encontrou no c\xF3digo original</h3>
<ul>
<li>As regras somam <code>result +=</code> dentro de <code>Parallel.For</code> sem sincroniza\xE7\xE3o: o mesmo cromossoma recebe notas diferentes em cada avalia\xE7\xE3o (erro mediano de 20\u201345 % por regra, medido com o C# original).</li>
<li>Na primeira execu\xE7\xE3o a onda 1 \xE9 uma linha em 0 (o vetor \xE9 criado antes de o comprimento est\xE1tico ser definido), o que penaliza todas as notas por igual.</li>
<li>Pausas e prolongamentos recebem pontos fixos ou s\xE3o neutros em v\xE1rias regras, enquanto as notas s\xF3 podem perder pontos; o <code>ScoreBalance</code> pede 7\u201340 % de figuras sem ataque, mas nas melodias reais esse valor \xE9 58\u201383 %.</li>
<li>A auto-harmoniza\xE7\xE3o compara genes e n\xE3o as notas que soam (um prolongamento conta como a nota 74), premeia quartas e penaliza sextas, ao contr\xE1rio do contraponto a duas vozes.</li>
<li>Duas gralhas de atribui\xE7\xE3o (<code>result = 2f</code> e <code>result = +10f</code>) e um ramo inalcan\xE7\xE1vel em <code>EvaluateRange</code>.</li>
<li>Mais lapsos que o pr\xF3prio c\xF3digo ou relat\xF3rio contradizem: o \xABprolongamento de prolongamento\xBB nunca \xE9 avaliado; o equil\xEDbrio d\xE1 \u2212\u221E sem pausas; as \xABrepeti\xE7\xF5es interessantes\xBB comparam prolongamentos (a mesma condi\xE7\xE3o que os autores corrigiram nos intervalos); o b\xF3nus de figura \xABno in\xEDcio do compasso\xBB chega uma semicolcheia tarde; os intervalos s\xF3 se medem entre semicolcheias vizinhas e a marca \u2212100 (para os saltar) custa um ponto a cada nota depois de um prolongamento. No modo cl\xE1ssico est\xE3o corrigidos por omiss\xE3o (caixa \xABCorrigir os lapsos do original\xBB).</li>
<li>A regra de termina\xE7\xE3o s\xF3 pede uma nota final prolongada, e os seus testes aninhados (\xABn\xE3o \xE9 prolongamento\xBB) d\xE3o a pontua\xE7\xE3o m\xE1xima a uma nota final de s\xF3 duas semicolcheias, ao contr\xE1rio do coment\xE1rio (\xABtermina\xE7\xE3o com notas mais longas\xBB); fica como no original. As f\xF3rmulas de final que o original previa ficaram por fazer: h\xE1 agora uma regra \xABF\xF3rmulas de final (corpus)\xBB, aprendida com 6758 melodias reais (3\u20132\u20131, 2\u20132\u20131, 7\u20131\u2026, no 1.\xBA ou 3.\xBA tempo, abaixo do centro da melodia).</li>
</ul>

<li>As sa\xEDdas das regras originais t\xEAm a surpresa mel\xF3dica do ru\xEDdo branco e 2\u20133 vezes mais notas do que melodias reais. Em c\xE2none a 1 compasso soam t\xE3o consonantes como ru\xEDdo ao acaso: as regras de auto-harmoniza\xE7\xE3o n\xE3o chegavam para dois violinistas lerem a mesma parte.</li>

</ul>

<h3>O trabalho original \xE0 luz da literatura</h3>
<p>A observa\xE7\xE3o de que o contorno mel\xF3dico tem componentes c\xEDclicas j\xE1 existia (Schmuckler 1999, 2010, com an\xE1lise de Fourier do contorno), tal como guiar a gera\xE7\xE3o por curvas desenhadas (Xenakis, Hyperscore, MorpheuS). O que o relat\xF3rio tinha de pr\xF3prio era a combina\xE7\xE3o: v\xE1rias curvas-alvo m\xF3veis, n\xE3o somadas, cada uma com uma bacia, a competir pelas notas na aptid\xE3o de um AG, para dar forma \xE0 melodia e vozes impl\xEDcitas. N\xE3o encontrei reutiliza\xE7\xF5es do reposit\xF3rio. A ideia geral \u2014 controlar a gera\xE7\xE3o com curvas ao longo do tempo (tens\xE3o, altura m\xE9dia por compasso, contornos desenhados) \u2014 tornou-se corrente depois de 2020 nas redes neuronais (FIGARO, MIDI-Draw, Music ControlNet), por caminhos independentes. A an\xE1lise completa, com fontes, est\xE1 no README.</p>

<h3>Corpus de refer\xEAncia</h3>
<p>480 melodias do corpus do music21, em dom\xEDnio p\xFAblico: 240 can\xE7\xF5es da cole\xE7\xE3o Essen, 120 temas de <em>O'Neill's Music of Ireland</em> (1850) e 120 sopranos de corais de Bach, cortadas nos primeiros 8 compassos. Tr\xEAs andamentos dos c\xE2nones de Telemann (Sonata I Vivace, Sonata II Vivace, Sonata III Spirituoso) foram transcritos das partituras (ornamentos omitidos, tercinas aproximadas); em todos, a an\xE1lise de contraponto d\xE1 o m\xE1ximo na entrada real da 2.\xAA voz.</p>
`,en:`
<h3>What it is</h3>
<p>A web version of <em>GeneticMusic</em> (Rui Luz and Rafael Silva, IPCA 2020): a genetic algorithm composes a melody and the fitness includes <strong>attractor waves</strong>, curves that pull the notes into a basin around them. Everything runs in the browser; the same seed always gives the same piece.</p>

<h3>Two models, up to three voices</h3>
<ul>
<li><strong>Classic</strong>: the 15 rules of <code>AlgorithmFitness.cs</code>, ported rule by rule (checked against the compiled original C#: 0 differences in 795 comparisons), with the weights of the original form and bit-level operators as in GeneticSharp.</li>
<li><strong>Attractor field</strong>: the waves get continuous basins (the pull decays with the distance), they can be phrase arches, 1/f noise or chaotic attractors, and rules from music cognition are added (see below). Each rule is a mean per note, so rests are no longer a safe harbour.</li>
<li><strong>Voices</strong>: in either model the melody can be played by 2 or 3 voices, each with its instrument, entry bar and interval (unison, octaves, diatonic 5th or 4th), so that several musicians read the same part as in Telemann\u2019s <em>Canons m\xE9lodieux</em> (TWV 40:118\u2013123). The counterpoint between every pair of voices is part of the fitness and of the initial population, from generation 0.</li>
</ul>
<p>Under \u201CRule weights\u201D, the \u201C?\u201D button next to each weight explains what the rule measures and how it changes the melody; in the classic mode the descriptions also interpret what the authors intended, from the code and its comments.</p>

<h3>Composition heuristics and styles</h3>
<p>A search of the literature (66 findings with their sources, in <code>web/results/estilos/literatura.csv</code>) gave general rules of melody writing \u2014 more falling than rising steps (Huron), step inertia (Chiu &amp; Temperley), compensated leaps and, when consecutive, only as arpeggios (Fux, Jeppesen), no tritones or sevenths, an arch per phrase (Huron), the phrase-final note longer and lower (Tierney, Russo &amp; Patel), repeated rhythmic motifs (Schoenberg; Savage et al.) \u2014 and the features of 36 styles: songs, Irish and Scottish dances, Baroque dances, Classical topics, Portuguese dances, fado, blues, jazz and pop. Each rule measures one feature of the melody and compares it with a target range: the P10\u2013P90 of real melodies when the corpus has them (Essen songs, Bach chorales, reels, jigs, slip jigs, hornpipes, strathspeys, marches), otherwise the value from the literature. Nothing is maximised: inside the range a rule scores 1. The weight \u201CComposition heuristics\u201D brings them into the fitness; choosing a style adjusts the meter, phrase, form and tempo and keeps that weight above 0. With cross-validation, the general rules put a real melody above the same melody with its notes shuffled in 90 % of the pairs; in the genetic algorithm, each style takes the melodies inside its ranges (<code>web/results/estilos.md</code>).</p>

<h3>Languages</h3>
<p>The page exists in Portuguese and in English (menu in the header). All its texts are in a single file, <code>web/src/i18n/texts.js</code>, and the page only holds placeholders; to add a language, add it to the list and translate the entries.</p>

<h3>Building blocks from the corpus, by meter</h3>
<p>9,644 real melodies (Essen, Aird\u2019s Airs, O\u2019Neill, Ryan\u2019s Mammoth, Bach) were separated by time signature and cut into beats: a quarter note in the simple meters (2/4, 3/4, 4/4), a dotted quarter \u2014 three eighths \u2014 in the compound ones (3/8, 6/8, 9/8, 12/8). Each beat has a rhythmic figure (in 6/8, mostly three eighths or quarter and eighth), a contour in scale degrees and an entry interval. Several models were compared on melodies left out (cross-validation): the next figure is predicted better from the previous figures \u2014 a two-step \u201Ctree\u201D beats one step, and even a whole bar of memory still helps \u2014 while the direction of the last note (up or down, by step or by leap) says little about the rhythm but a lot about the next interval (after a leap the melody tends to turn back). The generator uses one such model per meter to write the initial population, in a mutation and in the rule \u201CCorpus idiom\u201D; each rule counts only up to its typical value in the real music of that meter (\u201Cdo not maximise\u201D). All the counts and probabilities are in auditable tables (<code>web/results/meters/</code>, as CSV and in an Excel workbook), and the \u201CCorpus patterns\u201D panel, in the Analyse tab, shows those of the chosen meter.</p>

<h3>Score and LilyPond</h3>
<p>The \u201CScore\u201D button shows the piece in standard notation, one staff per voice, with the Gonville font (made as a stand-in for LilyPond\u2019s font) and LilyPond\u2019s usual layout. \u201CPDF\u201D downloads the score as a vector A4 PDF, drawn by the same code. The staff size adjusts to fill whole pages: if the last page would be almost empty, the staff shrinks and the piece fits on one page fewer; if it would be half full, the staff grows until the music fills every page. \u201CStaves\u201D chooses between one staff per voice and the canon on a single line, as rounds are printed: a boxed number marks where each voice comes in (when the 1st voice reaches number 2, the 2nd starts from the beginning), with a legend giving each voice\u2019s instrument, entry and interval, and repeat signs in rounds. \u201CLilyPond (.ly)\u201D downloads the code to engrave the score with LilyPond itself, with the same choice. In the classic mode the two waves W1 and W2 are edited with the same fields as the original form.</p>

<h3>Editable waves and experiments</h3>
<p>Each wave has a type, frequency, phase, mean and amplitude (or minimum and maximum) and a basin with a width and a shape; there can be up to 4. The waves of the settings are drawn dashed on the score before generating. The auto-configuration buttons suggest waves, form, weights and algorithm from the voices; each run is recorded with its settings, and \u201CTry 5 seeds\u201D shows whether a change helps consistently.</p>

<h3>Reverse analysis</h3>
<p>235 complete real melodies, their retrogrades and null models were passed through the rules. The original rules give real music the same score as white noise (50 % of the pairs); the new ones tell them apart in 96 % of the pairs, mostly through proximity and the melodic forces. Almost no rule tells a melody from its retrograde (52 %), and the GA drives the rules to twice the value real music reaches. The weights learned from these data are available as a preset (\u201CLearned from real music\u201D). Details in <code>web/results/reverse.md</code>.</p>

<h3>Starting combinations for the classic mode</h3>
<p>A study of the original algorithm with 3,074 real melodies (Essen songs, reels and hornpipes, Bach chorales) did three things. First, a design of experiments (Plackett\u2013Burman, 64 runs, 30 values of the original): no single value lifts the algorithm off critic 0. Then an inverse calibration: the constants measured on real music, and weights that put real music above its neighbours. Finally, a cross-entropy optimisation, confirmed with 24 new seeds.</p>
<p>With the original\u2019s bit operators, the combinations approach the shape: for example, the range goes from 36 to 14 semitones and the notes per beat from 2.7 to 0.6. The critic, however, stays at 0, because the rules do not see syncopations or the size of the leaps. With the musical operators, the critic reaches 0.90\u20130.92: the \u201CSong\u201D ends on the tonic in 71 % of the pieces (real songs: 73 %), the \u201CDance\u201D has the density of real dances and the \u201CChorale\u201D the steps of chorales.</p>

<h3>What was found in the original code</h3>
<ul>
<li>The rules add <code>result +=</code> inside <code>Parallel.For</code> without synchronisation: the same chromosome gets different scores at each evaluation (median error of 20\u201345 % per rule, measured with the original C#).</li>
<li>On the first run wave 1 is a line at 0 (the array is created before the static length is set), which penalises every note alike.</li>
<li>Rests and prolongations get fixed points or are neutral in several rules, while notes can only lose points; <code>ScoreBalance</code> asks for 7\u201340 % of figures without an onset, but in real melodies this value is 58\u201383 %.</li>
<li>The self-harmonisation compares genes, not the sounding notes (a prolongation counts as note 74), rewards fourths and penalises sixths, unlike two-voice counterpoint.</li>
<li>Two assignment typos (<code>result = 2f</code> and <code>result = +10f</code>) and an unreachable branch in <code>EvaluateRange</code>.</li>
<li>More lapses that the code or the report itself contradict: the \u201Cprolongation of a prolongation\u201D is never scored; the balance gives \u2212\u221E without rests; the \u201Cinteresting repetitions\u201D compare prolongations (the same condition the authors fixed in the intervals rule); the \u201Cstart of the bar\u201D figure bonus arrives one sixteenth late; the intervals are only measured between neighbouring sixteenths and the \u2212100 marker (meant to skip them) costs a point for each note after a prolongation. In the classic mode they are fixed by default (box \u201CFix the original\u2019s lapses\u201D).</li>
<li>The ending rule only asks for a prolonged final note, and its nested tests (\u201Cis not a prolongation\u201D) give the top score to a final note of only two sixteenths, contrary to the comment (\u201Cending with longer notes\u201D); it is kept as in the original. The ending formulas the original planned were never done: there is now a rule \u201CEnding formulas (corpus)\u201D, learned from 6,758 real melodies (3\u20132\u20131, 2\u20132\u20131, 7\u20131\u2026, on the 1st or 3rd beat, below the centre of the melody).</li>
</ul>

<ul>
<li>The outputs of the original rules have the melodic surprise of white noise and 2\u20133 times more notes than real melodies. As a canon at 1 bar they sound as consonant as random noise: the self-harmonisation rules were not enough for two violinists to read the same part.</li>
<li>Just swapping the bit operators for musical operators takes the critic from 0.00 to 0.93.</li>
<li>How much comes from the initial population: with musical patterns (rhythmic cells and scale) the best individual of generation 0 already has a critic of 0.71\u20130.88. From a random population, without patterns, the GA reaches the same fitness with 1\u20132 voices in 1000\u20132000 generations, but the critic stays ~0.1 lower; with 3 voices it does not get there. The \u201CInitial population\u201D option lets you watch that convergence from noise.</li>
<li>Considering the canon from the initial population: with 2 voices the counterpoint reaches 0.8 in the 1st generation (22 generations without it); with 3 voices the final result also improves (triads 87 % against 72 %, critic 0.79 against 0.63).</li>
<li>Without the basins (ablation) the critic stays the same: the attractor waves control the shape of the contour, not the quality by themselves.</li>
<li>Rests: with the default weights the original hardly generates rests; when the waves are strengthened, it stops attacking notes (onsets from 0.7 to 0.2 per sixteenth, rests up to 10 %), because the wave rule only penalises onsets.</li>
<li>In the 480 real melodies a slow wave (1 cycle every 4\u20138 bars, \xB12.9 semitones) is significant in 73 % of the cases, against 7 % in the same melodies shuffled; but it also appears in 84 % of random walks. The oscillation is a real factor, shared by any contour that moves by steps.</li>
</ul>

<h3>The original work in the light of the literature</h3>
<p>The observation that melodic contour has cyclic components already existed (Schmuckler 1999, 2010, with Fourier analysis of the contour), as did guiding generation with drawn curves (Xenakis, Hyperscore, MorpheuS). What the report had of its own was the combination: several moving target curves, not summed, each with a basin, competing for the notes in a GA\u2019s fitness, to shape the melody and implied voices. I found no reuse of the repository. The general idea \u2014 controlling generation with curves over time (tension, mean pitch per bar, drawn contours) \u2014 became common after 2020 in neural networks (FIGARO, MIDI-Draw, Music ControlNet), along independent paths. The full analysis, with sources, is in the README.</p>

<h3>Reference corpus</h3>
<p>480 melodies from the music21 corpus, in the public domain: 240 songs from the Essen collection, 120 tunes from <em>O\u2019Neill\u2019s Music of Ireland</em> (1850) and 120 Bach chorale sopranos, cut at the first 8 bars. Three movements of Telemann\u2019s canons (Sonata I Vivace, Sonata II Vivace, Sonata III Spirituoso) were transcribed from the scores (ornaments left out, triplets approximated); in all of them, the counterpoint analysis peaks at the real entry of the 2nd voice.</p>
