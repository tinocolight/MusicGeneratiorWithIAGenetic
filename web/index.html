<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ondas Atratoras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Every text of this page lives in src/i18n/texts.js (one entry per key, one field per language).
     Here there are only placeholders: data-i18n (text), data-i18n-html (text with markup),
     data-i18n-title / data-i18n-aria-label (attributes). -->
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 data-i18n="app.title"></h1>
      <p data-i18n="app.subtitle"></p>
    </div>
    <div class="top-tools">
      <label class="lang" for="langSelect"><span data-i18n="lang.label"></span> <select id="langSelect"></select></label>
      <nav class="tabs" role="tablist" data-i18n-aria-label="nav.sections">
        <button role="tab" id="tab-compose" aria-selected="true" data-panel="compose" data-i18n="tab.compose"></button>
        <button role="tab" id="tab-explore" aria-selected="false" data-panel="explore" data-i18n="tab.explore"></button>
        <button role="tab" id="tab-vary" aria-selected="false" data-panel="vary" data-i18n="tab.vary"></button>
        <button role="tab" id="tab-analyze" aria-selected="false" data-panel="analyze" data-i18n="tab.analyze"></button>
        <button role="tab" id="tab-evaluate" aria-selected="false" data-panel="evaluate" data-i18n="tab.evaluate"></button>
        <button role="tab" id="tab-about" aria-selected="false" data-panel="about" data-i18n="tab.about"></button>
      </nav>
    </div>
  </header>

  <section class="stage" data-i18n-aria-label="stage.aria">
    <div class="stage-head">
      <h2 id="pieceTitle" data-i18n="piece.example"></h2>
      <div class="chips" id="pieceChips"></div>
    </div>
    <canvas id="roll" data-i18n-aria-label="roll.aria"></canvas>
    <div id="score" class="score" hidden data-i18n-aria-label="score.aria"></div>
    <details id="lilyBox" hidden><summary data-i18n="lily.summary"></summary>
      <div class="group" style="margin-top:8px">
        <textarea id="lilyText" readonly data-i18n-aria-label="lily.aria"></textarea>
        <div class="row"><button class="btn" id="copyLily" type="button" data-i18n="common.copy"></button><span class="hint" id="lilyNote" data-i18n-html="lily.note"></span></div>
      </div>
    </details>
    <div class="legend" id="legend"></div>
    <div class="transport">
      <div class="viewswitch" role="group" data-i18n-aria-label="view.aria">
        <button type="button" id="viewRoll" aria-pressed="true" data-i18n="view.roll"></button>
        <button type="button" id="viewScore" aria-pressed="false" data-i18n="view.score"></button>
      </div>
      <button class="btn primary" id="playBtn" type="button" data-i18n="play.play"></button>
      <label for="bpm" data-i18n-title="transport.tempo.title"><span data-i18n="transport.tempo"></span> <input type="range" id="bpm" min="40" max="240" value="84"><span id="bpmVal" class="status">84</span></label>
      <label for="canonPlay"><input type="checkbox" id="canonPlay" checked> <span data-i18n="transport.allVoices"></span></label>
      <label for="dynPlay" id="dynRow" hidden data-i18n-title="transport.dyn.title"><input type="checkbox" id="dynPlay" checked> <span data-i18n="transport.dyn"></span></label>
      <button class="btn" id="midiBtn" type="button" data-i18n="transport.midi"></button>
      <label for="scoreLayout" data-i18n-title="transport.staves.title"><span data-i18n="transport.staves"></span> <select id="scoreLayout">
        <option value="staves" data-i18n="transport.staves.each"></option>
        <option value="line" data-i18n="transport.staves.line"></option>
      </select></label>
      <button class="btn" id="pdfBtn" type="button" data-i18n="transport.pdf" data-i18n-title="transport.pdf.title"></button>
      <label for="pdfQr" data-i18n-title="transport.qr.title"><input type="checkbox" id="pdfQr"> <span data-i18n="transport.qr"></span></label>
      <input type="url" id="qrBase" size="30" hidden data-i18n-title="transport.qrBase.title" data-i18n-aria-label="transport.qrBase.title">
      <button class="btn" id="linkBtn" type="button" data-i18n="transport.link" data-i18n-title="transport.link.title"></button>
      <label class="btn" for="openFile" data-i18n-title="transport.open.title"><span data-i18n="transport.open"></span><input type="file" id="openFile" accept=".pdf,.mid,.midi,application/pdf,audio/midi" hidden></label>
      <button class="btn" id="lilyBtn" type="button" data-i18n="transport.lily" data-i18n-title="transport.lily.title"></button>
      <span class="note-inline" id="midiNote"></span>
    </div>
  </section>

  <!-- COMPOR / COMPOSE -->
  <section class="panel active" id="panel-compose" role="tabpanel" aria-labelledby="tab-compose">
    <div class="cols">
      <div class="box" id="controls">
        <div class="quick">
          <h3 data-i18n="quick.title"></h3>
          <p class="hint" data-i18n="quick.hint"></p>
          <div class="row">
            <button class="btn primary" id="qsBtn" type="button" data-i18n="qs.open" data-i18n-title="qs.open.title" aria-haspopup="dialog"></button>
            <button class="btn" id="autoBtn" type="button" data-i18n="quick.auto" data-i18n-title="quick.auto.title"></button>
            <button class="btn" id="surpriseBtn" type="button" data-i18n="quick.surprise" data-i18n-title="quick.surprise.title"></button>
            <button class="btn" id="resetBtn" type="button" data-i18n="quick.reset"></button>
          </div>
        </div>

        <h3 data-i18n="piece.title"></h3>
        <div class="field"><span data-i18n="piece.model"></span>
          <select id="mode">
            <option value="field" data-i18n="model.field"></option>
            <option value="classic" data-i18n="model.classic"></option>
          </select></div>
        <div class="field"><span data-i18n="piece.key"></span><select id="scale"></select></div>
        <div class="field"><span data-i18n="piece.mode"></span><select id="major"><option value="1" data-i18n="mode.major"></option><option value="0" data-i18n="mode.minor"></option></select></div>
        <div class="field"><span data-i18n="style.label"></span><select id="style"></select></div>
        <p class="hint" id="styleHint"></p>
        <div class="field"><span data-i18n="piece.meter"></span><select id="meter"></select></div>
        <p class="hint" id="meterHint"></p>
        <div class="field"><span data-i18n="piece.bars"></span><select id="bars"><option>4</option><option>6</option><option selected>8</option><option>10</option><option>12</option><option>16</option><option>20</option><option>24</option><option>32</option><option>48</option><option>64</option></select></div>
        <p class="hint" id="barsHint" hidden></p>
        <div class="field" id="formRow"><span data-i18n="piece.form"></span><select id="form"></select></div>
        <div class="field" id="phraseRow"><span data-i18n="piece.phrase"></span><select id="phraseBars"><option>1</option><option selected>2</option><option>4</option><option>8</option></select></div>

        <h3 data-i18n="voices.title"></h3>
        <div class="field"><span data-i18n="voices.ensemble"></span><select id="ensemble"></select></div>
        <div id="voiceRows"></div>
        <label class="hint" for="circular"><input type="checkbox" id="circular"> <span data-i18n="voices.circular"></span></label>
        <p class="hint" id="voicesHint"></p>

        <div id="wavesSection" class="group">
          <h3 data-i18n="waves.title"></h3>
          <div class="field"><span data-i18n="waves.preset"></span><select id="preset"></select></div>
          <div class="field"><span data-i18n="waves.def"></span><select id="waveDef"><option value="meanAmp" data-i18n="waves.def.meanAmp"></option><option value="minMax" data-i18n="waves.def.minMax"></option></select></div>
          <div id="waveCards" class="group"></div>
          <div class="row">
            <button class="btn" id="addWave" type="button" data-i18n="waves.add"></button>
            <button class="btn" id="wavesAuto" type="button" data-i18n="waves.auto" data-i18n-title="waves.auto.title"></button>
            <button class="btn" id="wavesReal" type="button" data-i18n="waves.real" data-i18n-title="waves.real.title"></button>
          </div>
          <p class="hint" id="wavesHint"></p>
        </div>
        <div id="classicWavesSection" class="group" hidden>
          <h3 data-i18n="classic.presets.title"></h3>
          <p class="hint" data-i18n-html="classic.presets.hint"></p>
          <div class="row" id="classicPresets"></div>
          <div class="field"><span data-i18n="classic.ops"></span><select id="classicOps">
            <option value="musical" data-i18n="ops.musical"></option>
            <option value="binary" data-i18n="ops.binary"></option>
          </select></div>
          <p class="hint" id="classicPresetHint"></p>
          <h3 data-i18n="classic.waves.title"></h3>
          <p class="hint" id="classicHint" data-i18n-html="classic.waves.hint"></p>
          <div id="classicWaveCards" class="group"></div>
          <h3 data-i18n="classic.consts.title"></h3>
          <div class="wave-grid" id="classicConsts"></div>
          <label class="hint" for="classicFixLapses"><input type="checkbox" id="classicFixLapses"> <span data-i18n="classic.fixLapses"></span></label>
          <label class="hint" for="classicFirstRun"><input type="checkbox" id="classicFirstRun"> <span data-i18n="classic.firstRun"></span></label>
          <div class="row"><button class="btn" id="classicWavesReset" type="button" data-i18n="classic.resetOriginal"></button></div>
        </div>

        <details id="weightsBox"><summary data-i18n="weights.title"></summary>
          <p class="hint" id="weightsIntro" style="margin-top:8px"></p>
          <div class="row" id="weightPresets" style="margin-top:8px"></div>
          <label class="hint" for="capRules" id="capRulesRow"><input type="checkbox" id="capRules"> <span data-i18n="weights.caps"></span></label>
          <div class="wgrid" id="weights"></div>
        </details>
        <details id="gaBox"><summary data-i18n="ga.title"></summary>
          <div class="group" style="margin-top:8px">
            <div class="field"><span data-i18n="ga.generations"></span><input type="number" id="generations" min="20" max="20000" step="50" value="600"></div>
            <div class="field"><span data-i18n="ga.pop"></span><input type="number" id="popSize" min="10" max="400" step="10" value="80"></div>
            <div class="field"><span data-i18n="ga.mutation"></span><input type="number" id="mutation" min="0" max="1" step="0.05" value="0.9"></div>
            <div class="field"><span data-i18n="ga.operators"></span>
              <select id="operators">
                <option value="musical" data-i18n="ops.musicalFull"></option>
                <option value="binary" data-i18n="ops.binaryFull"></option>
              </select></div>
          </div>
        </details>
        <h3 data-i18n="start.title"></h3>
        <div class="field"><span data-i18n="start.each"></span>
          <select id="startMode">
            <option value="seed" data-i18n="start.seedOpt"></option>
            <option value="newSeed" data-i18n="start.newSeedOpt"></option>
            <option value="continue" data-i18n="start.continueOpt"></option>
          </select></div>
        <div class="field"><span data-i18n="init.title"></span>
          <select id="initMode">
            <option value="auto" data-i18n="init.auto"></option>
            <option value="musical" data-i18n="init.musical"></option>
            <option value="random" data-i18n="init.random"></option>
            <option value="blocks" data-i18n="init.blocks"></option>
          </select></div>
        <div class="field"><span data-i18n="ga.seed"></span><input type="number" id="seed" min="1" max="999999" step="1" value="7"></div>
        <label class="hint" for="slowRun"><input type="checkbox" id="slowRun"> <span data-i18n="ga.slow"></span></label>
        <p class="hint" id="startHint"></p>

        <div class="row">
          <button class="btn primary" id="runBtn" type="button" data-i18n="run.generate"></button>
          <button class="btn" id="stopBtn" type="button" disabled data-i18n="common.stop"></button>
          <button class="btn" id="reseedBtn" type="button" data-i18n="run.reseed" data-i18n-title="run.reseed.title"></button>
          <button class="btn" id="batchBtn" type="button" data-i18n="run.batch" data-i18n-title="run.batch.title"></button>
        </div>
        <progress id="progress" max="1" value="0"></progress>
        <div class="status" id="runStatus" data-i18n="status.ready"></div>

        <details id="configBox"><summary data-i18n="config.summary"></summary>
          <div class="group" style="margin-top:8px">
            <textarea id="configText" data-i18n-aria-label="config.aria"></textarea>
            <div class="row"><button class="btn" id="copyConfig" type="button" data-i18n="common.copy"></button><button class="btn" id="applyConfig" type="button" data-i18n="config.apply"></button></div>
            <p class="hint" id="configNote"></p>
          </div>
        </details>
      </div>

      <div class="box">
        <h3 data-i18n="evo.title"></h3>
        <canvas class="chart" id="historyChart" data-i18n-aria-label="evo.aria"></canvas>
        <div class="legend"><span><i style="background:var(--accent)"></i><span data-i18n="evo.best"></span></span><span><i style="background:var(--grid-strong)"></i><span data-i18n="evo.mean"></span></span><span><i style="background:var(--wave-3)"></i><span data-i18n="evo.diversity"></span></span></div>
        <div id="snapBox" hidden>
          <h3 data-i18n="conv.title"></h3>
          <p class="hint" data-i18n="conv.hint"></p>
          <div class="row snaps" id="snapshots"></div>
        </div>
        <h3 data-i18n="parts.title"></h3>
        <p class="hint" id="partsHint" data-i18n="parts.hint.field"></p>
        <div class="bars" id="partsBars"></div>
        <details id="heurBox" hidden><summary data-i18n="heur.title"></summary>
          <div class="heur-body group" style="margin-top:8px"></div>
        </details>
        <h3 data-i18n="exp.title"></h3>
        <p class="hint" data-i18n="exp.hint"></p>
        <div id="batchSummary"></div>
        <div class="scroll" id="experiments"><p class="hint" data-i18n="exp.none"></p></div>
      </div>
    </div>
  </section>

  <!-- EXPLORAR / EXPLORE -->
  <section class="panel" id="panel-explore" role="tabpanel" aria-labelledby="tab-explore">
    <div class="cols">
      <div class="box">
        <h3 data-i18n="me.title"></h3>
        <p class="hint" data-i18n-html="me.hint"></p>
        <div class="field"><span data-i18n="me.x"></span><select id="mx"></select></div>
        <div class="field"><span data-i18n="me.y"></span><select id="my"></select></div>
        <div class="field"><span data-i18n="me.evals"></span><input type="number" id="meEvals" min="2000" max="200000" step="2000" value="30000"></div>
        <div class="row"><button class="btn primary" id="meRun" type="button" data-i18n="me.run"></button><button class="btn" id="meStop" type="button" disabled data-i18n="common.stop"></button></div>
        <progress id="meProgress" max="1" value="0"></progress>
        <div class="status" id="meStatus" data-i18n="me.status"></div>
      </div>
      <div class="box">
        <div class="axis" id="myLabel">↑</div>
        <canvas id="eliteMap" data-i18n-aria-label="me.aria"></canvas>
        <div class="axis" id="mxLabel">→</div>
        <div class="status" id="cellInfo"></div>
      </div>
    </div>
  </section>

  <!-- VARIAÇÕES / VARIATIONS -->
  <section class="panel" id="panel-vary" role="tabpanel" aria-labelledby="tab-vary">
    <div class="cols">
      <div class="box">
        <h3 data-i18n="var.title"></h3>
        <p class="hint" data-i18n="var.hint"></p>
        <div class="field"><span data-i18n="var.divergence"></span><input type="range" id="divergence" min="-3" max="-0.3" step="0.05" value="-1.3"></div>
        <div class="status" id="divVal"></div>
        <div class="field"><span data-i18n="var.what"></span><select id="varMode"><option value="pitch" data-i18n="var.pitch"></option><option value="full" data-i18n="var.full"></option></select></div>
        <div class="field"><span data-i18n="var.rule"></span><select id="varRule"><option value="nearest" data-i18n="var.nearest"></option><option value="ceiling" data-i18n="var.ceiling"></option></select></div>
        <div class="row"><button class="btn primary" id="varRun" type="button" data-i18n="var.run"></button><button class="btn" id="formRun" type="button" data-i18n="var.form"></button></div>
      </div>
      <div class="box">
        <h3 data-i18n="var.listTitle"></h3>
        <div class="varlist" id="varList"><p class="hint" data-i18n="var.placeholder"></p></div>
      </div>
    </div>
  </section>

  <!-- ANALISAR / ANALYSE -->
  <section class="panel" id="panel-analyze" role="tabpanel" aria-labelledby="tab-analyze">
    <div class="cols">
      <div class="box">
        <h3 data-i18n="an.title"></h3>
        <p class="hint" data-i18n="an.hint"></p>
        <div class="field"><span data-i18n="an.piece"></span><select id="anSource"></select></div>
        <div class="field" id="anCorpusRow"><span data-i18n="an.corpus"></span><select id="anCorpus"></select></div>
        <div class="field"><span data-i18n="an.file"></span><input type="file" id="anFile" accept=".mid,.midi,audio/midi"></div>
        <div class="field"><span data-i18n="an.parts"></span><input type="range" id="anK" min="1" max="8" value="2"></div>
        <div class="status" id="anKVal"></div>
        <div class="field"><span data-i18n="an.segmentation"></span><select id="anMode"><option value="phrase" data-i18n="an.seg.phrase"></option><option value="equal" data-i18n="an.seg.equal"></option></select></div>
        <div class="field"><span data-i18n="an.waves"></span><select id="anM"><option value="0" data-i18n="an.waves.auto"></option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
        <div class="row"><button class="btn primary" id="anRun" type="button" data-i18n="an.run"></button><button class="btn" id="anUse" type="button" disabled data-i18n="an.use"></button></div>
        <div class="status" id="anStatus"></div>
      </div>
      <div class="box">
        <h3 data-i18n="an.summaryTitle"></h3>
        <div id="anSummary" class="hint" data-i18n="an.summaryPlaceholder"></div>
      </div>
    </div>
    <div class="segs" id="anSegments"></div>
    <details class="box" id="blocksBox"><summary data-i18n="blocks.summary"></summary>
      <p class="hint" data-i18n="blocks.hint"></p>
      <div class="cols even" id="blocksTables"></div>
    </details>
  </section>

  <!-- AVALIAR / EVALUATE -->
  <section class="panel" id="panel-evaluate" role="tabpanel" aria-labelledby="tab-evaluate">
    <div class="cols even">
      <div class="box">
        <h3 data-i18n="ev.title"></h3>
        <p class="hint" data-i18n="ev.hint"></p>
        <div id="evalSummary"></div>
        <h3 data-i18n="ev.voicesTitle"></h3>
        <p class="hint" data-i18n="ev.voicesHint"></p>
        <div class="scroll" id="canonTable"></div>
      </div>
      <div class="box">
        <h3 data-i18n="ev.featuresTitle"></h3>
        <p class="hint" data-i18n="ev.featuresHint"></p>
        <div class="scroll" id="featureTable"></div>
      </div>
    </div>
  </section>

  <!-- SOBRE / ABOUT -->
  <section class="panel" id="panel-about" role="tabpanel" aria-labelledby="tab-about">
    <div class="box prose" id="aboutBox"></div>
  </section>
</div>
  <!-- INÍCIO RÁPIDO / QUICK START: six questions in a floating window (src/ui/quickstart.js) -->
  <dialog id="qsDialog" class="qs" aria-labelledby="qsTitle">
    <header class="qs-head">
      <div class="qs-headline">
        <span class="qs-kicker"><span data-i18n="qs.heading"></span> · <span id="qsStep"></span></span>
        <button type="button" class="qs-close" id="qsClose" data-i18n-aria-label="qs.close" data-i18n-title="qs.close">×</button>
      </div>
      <h2 id="qsTitle"></h2>
      <nav class="qs-dots" id="qsDots"></nav>
    </header>
    <div class="qs-body" id="qsBody"></div>
    <footer class="qs-foot">
      <button type="button" class="btn" id="qsBack" data-i18n="qs.back"></button>
      <span class="qs-live status" id="qsLive" aria-live="polite"></span>
      <button type="button" class="btn primary" id="qsNext" data-i18n="qs.next"></button>
      <button type="button" class="btn" id="qsApply" data-i18n="qs.apply" hidden></button>
      <button type="button" class="btn primary" id="qsRun" data-i18n="qs.applyRun" hidden></button>
    </footer>
  </dialog>

<script type="module" src="src/ui/app.js"></script>
</body>
</html>
