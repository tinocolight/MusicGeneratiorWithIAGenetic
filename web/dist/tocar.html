<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ondas Atratoras · Tocar</title>
<style>
/* Palette: 18th-century pigments on a cool manuscript grey.
   Prussian blue (1706, Telemann's contemporaries) for the interface, vermilion / verdigris /
   orpiment for the attractor waves. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #17212b;
  --muted: #5a6776;
  --line: #d6dde5;
  --accent: #1d4a7a;
  --accent-ink: #ffffff;
  --accent-soft: #dce7f3;
  --good: #2f7d5b;
  --warn: #a86a0c;
  --bad: #b33a24;
  --roll-bg: #fbfcfd;
  --paper: #fffdf8;
  --paper-ink: #16181b;
  --paper-muted: #5b6168;
  --paper-accent: #1d4a7a;
  --row: #f0f3f6;
  --grid: #e3e8ee;
  --grid-strong: #b9c3ce;
  --note: #17212b;
  --follower: #3a6fb0;
  --voice-3: #7a4fa0;
  --wave-1: #d9481c;
  --wave-2: #2e8b7a;
  --wave-3: #c98b1a;
  --wave-4: #6d7f2a;
  --segment: rgba(29, 74, 122, 0.06);
  --radius: 10px;
  --font-display: "IM Fell English", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1318;
    --surface: #151c23;
    --surface-2: #1b242c;
    --ink: #e5eaef;
    --muted: #97a4b1;
    --line: #2a3540;
    --accent: #7fa8d8;
    --accent-ink: #0e1318;
    --accent-soft: #1d2d3f;
    --good: #5cc29a;
    --warn: #e0a83a;
    --bad: #f07a52;
    --roll-bg: #121920;
    --paper: #e4e0d6;
    --paper-ink: #16181b;
    --paper-muted: #4a4f55;
    --paper-accent: #1d4a7a;
    --row: #172029;
    --grid: #202a34;
    --grid-strong: #3a4754;
    --note: #e5eaef;
    --follower: #8fb5e6;
    --voice-3: #c3a3ee;
    --wave-1: #f07a52;
    --wave-2: #5cc2ae;
    --wave-3: #e0a83a;
    --wave-4: #b3c46a;
    --segment: rgba(127, 168, 216, 0.08);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1318;
  --surface: #151c23;
  --surface-2: #1b242c;
  --ink: #e5eaef;
  --muted: #97a4b1;
  --line: #2a3540;
  --accent: #7fa8d8;
  --accent-ink: #0e1318;
  --accent-soft: #1d2d3f;
  --good: #5cc29a;
  --warn: #e0a83a;
  --bad: #f07a52;
  --roll-bg: #121920;
  --paper: #e4e0d6;
  --paper-ink: #16181b;
  --paper-muted: #4a4f55;
  --paper-accent: #1d4a7a;
  --row: #172029;
  --grid: #202a34;
  --grid-strong: #3a4754;
  --note: #e5eaef;
  --follower: #8fb5e6;
  --voice-3: #c3a3ee;
  --wave-1: #f07a52;
  --wave-2: #5cc2ae;
  --wave-3: #e0a83a;
  --wave-4: #b3c46a;
  --segment: rgba(127, 168, 216, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body {
  margin: 0;
  color: var(--ink);
  font: 14px/1.5 var(--font-body);
  padding-inline: 16px;
  padding-block: 0 32px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

header.top {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
  gap: 8px 24px; padding-block: 18px 4px; border-bottom: 1px solid var(--line);
}
.brand h1 {
  font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.1;
  margin: 0; letter-spacing: 0.01em; text-wrap: balance;
}
.brand p { margin: 2px 0 8px; color: var(--muted); max-width: 70ch; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 2px; }
nav.tabs button {
  font: 500 13px var(--font-body); border: 0; background: none; color: var(--muted);
  padding: 8px 12px; border-radius: 8px 8px 0 0; cursor: pointer; border-bottom: 2px solid transparent;
}
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
nav.tabs button:hover { color: var(--ink); }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* stage: the score strip shared by every tab */
.stage {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px; display: flex; flex-direction: column; gap: 10px;
}
.stage-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.stage-head h2 { margin: 0; font: 400 20px/1.2 var(--font-display); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 500 12px var(--font-mono); padding: 3px 8px; border-radius: 999px; background: var(--surface-2);
  border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip b { color: var(--ink); font-weight: 600; }
.chip.good { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.chip.good b { color: var(--good); }
.chip.warn b { color: var(--warn); }
.chip.bad b { color: var(--bad); }
#roll { width: 100%; height: 300px; display: block; border-radius: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12px; }
.legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.transport label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }

button.btn, label.btn {
  font: 600 13px var(--font-body); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  padding: 7px 14px; border-radius: 8px; cursor: pointer;
}
button.btn:hover, label.btn:hover { border-color: var(--accent); }
.transport label.btn { color: var(--ink); font-size: 13px; }
label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
/* a piece opened from a link or a file: the play button asks to be pressed (sound needs a tap) */
button.btn.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 35%, transparent); } }
@media (prefers-reduced-motion: reduce) { button.btn.pulse { animation: none; outline: 3px solid var(--accent); } }
button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.btn:disabled { opacity: 0.5; cursor: default; }
select, input[type="number"], input[type="text"], input[type="url"] {
  font: 13px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 7px; max-width: 100%;
}
input[type="number"] { width: 5.5em; font-family: var(--font-mono); }
input[type="range"] { accent-color: var(--accent); max-width: 160px; }

.panel { display: none; }
.panel.active { display: grid; gap: 14px; }
.cols { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 14px; align-items: start; }
.cols.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 860px) { .cols, .cols.even { grid-template-columns: 1fr; } }
.box {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px;
  display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.box h3 { margin: 0; font: 600 12px var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.box h4 { margin: 4px 0 0; font: 400 17px var(--font-display); }
.field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
.field > span { color: var(--muted); font-size: 12.5px; }
.field select { min-width: 0; width: 100%; max-width: 220px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; max-width: 70ch; }
details.weights summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 13px; }
.wgrid { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin-top: 8px; align-items: center; font-size: 12.5px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
progress { width: 100%; height: 6px; accent-color: var(--accent); }
.status { font: 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
canvas.chart { width: 100%; height: 150px; display: block; }

/* component bars (diverging around 0) */
.bars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 3px 10px; align-items: center; font-size: 12.5px; }
.bars .track { position: relative; height: 10px; background: var(--surface-2); border-radius: 3px; }
.bars .track::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--grid-strong); }
.bars .fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
.bars .fill.neg { background: var(--bad); }
.bars .num { font: 12px var(--font-mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

table.data { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.data th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); padding: 5px 6px; white-space: nowrap; }
table.data td { border-bottom: 1px solid var(--line); padding: 5px 6px; vertical-align: top; }
table.data td.num { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
.scroll { overflow-x: auto; }
.ok { color: var(--good); }
.off { color: var(--bad); }

.segs { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.seg { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.seg h4 { margin: 0; font: 400 17px var(--font-display); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 12.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.wave-tag { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

#eliteMap { width: 100%; max-width: 520px; aspect-ratio: 1; height: auto; display: block; cursor: crosshair; }
.axis { color: var(--muted); font-size: 12px; }
.varlist { display: grid; gap: 8px; }
.varitem { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.varitem .status { flex: 1; min-width: 160px; }
.prose { max-width: 75ch; }
.prose h3 { font: 400 21px var(--font-display); text-transform: none; letter-spacing: 0; color: var(--ink); margin: 12px 0 4px; }
.prose p, .prose li { color: var(--ink); }
.prose a { color: var(--accent); }
.note-inline { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.group { display: flex; flex-direction: column; gap: 10px; }

/* composer controls */
.quick { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 8px; background: var(--accent-soft); }
.quick .row button { flex: 1 1 auto; }
.voice-row { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.voice-row:first-child { border-top: 0; }
.voice-row .vname { font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.voice-row select { max-width: 100%; }
.voice-row .vsub { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
.wave-card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.wave-head { display: flex; align-items: center; gap: 8px; }
.wave-head select { flex: 1; min-width: 0; }
.wave-head .x { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 6px; }
.wave-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; }
.wave-grid label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
.wave-grid input, .wave-grid select { width: 100%; }
.wave-grid small { font: 11px var(--font-mono); color: var(--muted); }
.warn-text { color: var(--warn); }
textarea { width: 100%; min-height: 110px; font: 12px var(--font-mono); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
details > summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 13px; }
table.data tr.sel td { background: var(--accent-soft); }
table.data td .btn { padding: 3px 8px; font-size: 12px; }

.snaps { gap: 6px; }
.snaps .btn { padding: 4px 8px; font-size: 12px; display: inline-flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }
.snaps .btn small { font-family: var(--font-mono); color: var(--muted); font-weight: 400; }
.snaps .btn.primary small { color: inherit; }

/* view switch and engraved score */
.viewswitch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.viewswitch button { font: 500 13px var(--font-body); padding: 6px 12px; background: transparent; color: var(--muted); border: 0; cursor: pointer; }
.viewswitch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink, #fff); }
.viewswitch button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.score { background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); border-radius: var(--radius); max-height: 72vh; overflow: auto; padding: 4px 0; }
.score svg { display: block; }
.score g.on path, .score g.on rect { fill: var(--paper-accent) !important; stroke: var(--paper-accent) !important; }
.score .msg { padding: 24px; color: var(--muted); }
#lilyText { min-height: 220px; font: 12px/1.45 var(--font-mono); }

/* language menu in the header */
.top-tools { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.lang { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
@media (max-width: 860px) { .top-tools { align-items: flex-start; } }

/* rule weights: a "?" beside each weight opens what the rule does */
.wgrid { grid-template-columns: 1fr auto auto; }
.wgrid .wsub { grid-column: 1 / -1; margin-top: 6px; }
.whelp {
  width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--accent); font: 600 12px var(--font-body); cursor: pointer;
}
.whelp:hover { border-color: var(--accent); }
.whelp[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.wdesc {
  grid-column: 1 / -1; margin: 0 0 6px; padding: 6px 9px; background: var(--surface-2);
  border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; color: var(--ink); font-size: 12.5px; line-height: 1.45;
}
.wlabel.forced::after { content: " ●"; color: var(--accent); }
.muted { color: var(--muted); }

/* Quick start: the floating window with the six questions (src/ui/quickstart.js) */
dialog.qs {
  width: min(640px, calc(100vw - 32px)); max-height: min(720px, calc(100vh - 32px)); padding: 0;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink);
  box-shadow: 0 18px 60px rgba(10, 20, 35, 0.28); overflow: hidden;
}
dialog.qs[open] { display: flex; flex-direction: column; }
dialog.qs::backdrop { background: rgba(14, 22, 32, 0.45); backdrop-filter: blur(2px); }
.qs-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.qs-headline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.qs-kicker { font: 600 11.5px var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
.qs-close {
  border: 1px solid transparent; background: none; color: var(--muted); font: 22px/1 var(--font-body);
  width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
}
.qs-close:hover { border-color: var(--line); color: var(--ink); }
.qs-head h2 { margin: 6px 0 10px; font: 400 24px/1.2 var(--font-display); }
.qs-dots { display: flex; gap: 6px; }
.qs-dot {
  flex: 1; height: 6px; border-radius: 3px; border: 0; padding: 0; cursor: pointer;
  background: var(--line);
}
.qs-dot.done { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.qs-dot.on { background: var(--accent); }
.qs-body { padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.qs-note {
  margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 13.5px; line-height: 1.45;
}
.qs-group { margin-top: 6px; font: 600 11.5px var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.qs-opt {
  display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: baseline; cursor: pointer;
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface);
}
.qs-opt:hover { border-color: var(--accent); }
.qs-opt.on { border-color: var(--accent); background: var(--accent-soft); }
.qs-opt input { accent-color: var(--accent); margin: 0; }
.qs-opt-t { font-weight: 600; font-size: 13.5px; }
.qs-opt-d { grid-column: 2; color: var(--muted); font-size: 12.5px; }
.qs-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.qs-row.wrap { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.qs-row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.qs-field { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.qs-field select { width: 100%; }
.qs-desc { margin: 0; font-size: 13.5px; line-height: 1.45; }
.qs-calc { margin: 4px 0 0; font: 600 13px var(--font-mono); font-variant-numeric: tabular-nums; }
.qs-summary dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 6px 0 0; font-size: 13px; }
.qs-summary dt { color: var(--muted); }
.qs-summary dd { margin: 0; }
.qs-foot {
  display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2);
}
.qs-live { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
@media (max-width: 560px) {
  .qs-row { grid-template-columns: 1fr; }
  .qs-live { display: none; }
  .qs-foot { justify-content: space-between; flex-wrap: wrap; }
}

/* ------------------------------------------------------------------ the player a QR code opens (tocar.html) */
body.player-page { padding: 16px; }
.player { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.player-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.player-brand { margin: 0; font-family: var(--font-display); font-size: 20px; color: var(--accent); }
.player h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(24px, 6vw, 34px); line-height: 1.15; }
.player-meta { margin: 0; color: var(--muted); font-size: 14px; }
#plRoll { width: 100%; height: 180px; display: block; border-radius: 8px; border: 1px solid var(--line); background: var(--roll-bg); }
.player-bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.player-bar span { display: block; height: 100%; width: 0; background: var(--accent); }
.player-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.player-controls label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
button.btn.player-play { font-size: 18px; padding: 12px 28px; min-width: 160px; }
.player-voices { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 13.5px; }
.player-voices i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; background: var(--note); }
.player-voices i.v1 { background: var(--follower); }
.player-voices i.v2 { background: var(--voice-3); }
.player-actions { display: flex; flex-wrap: wrap; gap: 10px; }

justadas a \xAB{title}\xBB ({source}), transpostas para a tonalidade e o registo atuais. ",en:"Waves fitted to \u201C{title}\u201D ({source}), transposed to the current key and register. "},"waves.hint.out":{pt:"Onda fora do registo poss\xEDvel ({lo}\u2013{hi}): as notas v\xE3o ser puxadas para fora do alcance dos instrumentos.",en:"A wave is outside the possible register ({lo}\u2013{hi}): notes will be pulled out of the instruments\u2019 reach."},"waves.hint.ok":{pt:"As ondas cabem no registo poss\xEDvel ({lo}\u2013{hi}). A linha tracejada na partitura mostra-as antes de gerar.",en:"The waves fit the possible register ({lo}\u2013{hi}). The dashed line on the score shows them before generating."},"preset.custom":{pt:"Personalizado",en:"Custom"},"wpre.original":{pt:"Original (2 senos do C#)",en:"Original (the 2 sines of the C#)"},"wpre.arch":{pt:"Arco de frase (Huron)",en:"Phrase arch (Huron)"},"wpre.pink":{pt:"Flutua\xE7\xE3o 1/f (Voss & Clarke)",en:"1/f fluctuation (Voss & Clarke)"},"wpre.rossler":{pt:"Atrator de R\xF6ssler",en:"R\xF6ssler attractor"},"wpre.lorenz":{pt:"Atrator de Lorenz (2 registos)",en:"Lorenz attractor (2 registers)"},"wpre.compound":{pt:"Melodia composta (2 vozes, cf. Bach)",en:"Compound melody (2 voices, cf. Bach)"},"wpre.canon":{pt:"C\xE2none: seno com per\xEDodo = n\xBA de vozes \xD7 entrada",en:"Canon: sine with period = no. of voices \xD7 entry"},"wtype.sine":{pt:"Seno",en:"Sine"},"wtype.arch":{pt:"Arco de frase",en:"Phrase arch"},"wtype.pink":{pt:"Flutua\xE7\xE3o 1/f",en:"1/f fluctuation"},"wtype.rossler":{pt:"Atrator de R\xF6ssler",en:"R\xF6ssler attractor"},"wtype.lorenz":{pt:"Atrator de Lorenz",en:"Lorenz attractor"},"wtype.flat":{pt:"Constante (tessitura)",en:"Constant (tessitura)"},"basin.gaussian":{pt:"Gaussiana",en:"Gaussian"},"basin.gravity":{pt:"Gravitacional 1/(1+d\xB2)",en:"Gravitational 1/(1+d\xB2)"},"basin.step":{pt:"Degraus (C#)",en:"Steps (C#)"},"wave.n":{pt:"Onda {n}",en:"Wave {n}"},"wave.typeAria":{pt:"Tipo da onda {n}",en:"Type of wave {n}"},"wave.remove":{pt:"Remover onda",en:"Remove wave"},"wave.removeAria":{pt:"Remover onda {n}",en:"Remove wave {n}"},"wave.flat":{pt:"sem oscila\xE7\xE3o",en:"no oscillation"},"wave.cycle":{pt:"1 ciclo em {bars} c.",en:"1 cycle in {bars} bars"},"wave.freq":{pt:"Frequ\xEAncia (ciclos/compasso)",en:"Frequency (cycles/bar)"},"wave.phase":{pt:"Desfasamento (tempos)",en:"Phase shift (beats)"},"wave.phaseRandom":{pt:"in\xEDcio aleat\xF3rio (atrator)",en:"random start (attractor)"},"wave.phaseHint":{pt:"desloca a onda no tempo",en:"shifts the wave in time"},"wave.min":{pt:"M\xEDnimo (MIDI)",en:"Minimum (MIDI)"},"wave.max":{pt:"M\xE1ximo (MIDI)",en:"Maximum (MIDI)"},"wave.mean":{pt:"Valor m\xE9dio (MIDI)",en:"Mean (MIDI)"},"wave.amp":{pt:"Amplitude (\xB1 semitons)",en:"Amplitude (\xB1 semitones)"},"wave.ampHint":{pt:"metade da varia\xE7\xE3o",en:"half the swing"},"wave.basin":{pt:"Bacia \u03C3 (semitons)",en:"Basin \u03C3 (semitones)"},"wave.basinHint":{pt:"alcance da atra\xE7\xE3o",en:"reach of the attraction"},"wave.shape":{pt:"Forma da bacia",en:"Basin shape"},"wave.shapeHint":{pt:"como a atra\xE7\xE3o decai",en:"how the attraction decays"},"classic.presets.title":{pt:"Combina\xE7\xF5es de partida",en:"Starting combinations"},"classic.presets.hint":{pt:"Valores do algoritmo original escolhidos por um estudo com m\xFAsica real (desenho de experi\xEAncias e calibra\xE7\xE3o inversa; <code>web/results/classic-study.md</code>). Mudam os pesos, as ondas, as constantes e o AG; a tonalidade, os compassos e a semente ficam.",en:"Values of the original algorithm chosen by a study with real music (design of experiments and inverse calibration; <code>web/results/classic-study.md</code>). They change the weights, the waves, the constants and the GA; the key, the bars and the seed stay."},"classic.ops":{pt:"Afinada para",en:"Tuned for"},"ops.musical":{pt:"operadores musicais (soa melhor)",en:"musical operators (sounds better)"},"ops.binary":{pt:"operadores de bits (os do original)",en:"bit operators (those of the original)"},"ops.musicalShort":{pt:"operadores musicais",en:"musical operators"},"ops.binaryShort":{pt:"operadores de bits",en:"bit operators"},"classic.waves.title":{pt:"Ondas atratoras (como no programa original)",en:"Attractor waves (as in the original program)"},"classic.waves.hint":{pt:"Os campos do formul\xE1rio do C# para as duas ondas senoidais W1 e W2: <code>valor m\xE9dio + amplitude \xB7 sen(2\u03C0 \xB7 i / per\xEDodo + 2\u03C0 \xB7 desfasamento / 16)</code>, em semicolcheias. Valores inteiros como no original, exceto os per\xEDodos. Os pesos das regras \xABOnda 1\xBB e \xABOnda 2\xBB est\xE3o em \xABPesos das regras\xBB. As vozes definem as dist\xE2ncias da auto-harmoniza\xE7\xE3o e a reprodu\xE7\xE3o.",en:"The fields of the C# form for the two sine waves W1 and W2: <code>mean + amplitude \xB7 sin(2\u03C0 \xB7 i / period + 2\u03C0 \xB7 shift / 16)</code>, in sixteenths. Whole numbers as in the original, except the periods. The weights of the rules \u201CWave 1\u201D and \u201CWave 2\u201D are under \u201CRule weights\u201D. The voices set the distances of the self-harmonisation and the playback."},"classic.consts.title":{pt:"Constantes que o original fixava no c\xF3digo",en:"Constants the original fixed in the code"},"classic.fixLapses":{pt:"Corrigir os lapsos do original (7 regras que n\xE3o faziam o que o pr\xF3prio c\xF3digo ou relat\xF3rio descreve; ver \xABSobre\xBB)",en:"Fix the original\u2019s lapses (7 rules that did not do what the code itself or the report describes; see \u201CAbout\u201D)"},"classic.firstRun":{pt:"Simular a 1.\xAA execu\xE7\xE3o do original (a onda 1 fica uma linha plana no gene 0)",en:"Simulate the original\u2019s first run (wave 1 is a flat line at gene 0)"},"classic.resetOriginal":{pt:"Repor os valores do original",en:"Restore the original values"},"classic.presetCustom":{pt:"Valores alterados \xE0 m\xE3o.",en:"Values changed by hand."},"cwave.title":{pt:"Onda {n} (W{n})",en:"Wave {n} (W{n})"},"cwave.periods":{pt:"Per\xEDodos por compasso",en:"Periods per bar"},"cwave.mean":{pt:"Valor m\xE9dio (meios-tons, L\xE14 = 0)",en:"Mean (semitones, A4 = 0)"},"cwave.amp":{pt:"Amplitude (meios-tons)",en:"Amplitude (semitones)"},"cwave.ampHint":{pt:"a onda vai de \u2212A a +A",en:"the wave goes from \u2212A to +A"},"cwave.basin":{pt:"Bacia de atra\xE7\xE3o (meios-tons)",en:"Attraction basin (semitones)"},"cwave.basinHint":{pt:"nota a \u2264 \xBD: +3, \u2264 1: +1, \u2264 1\xBD: \u22124,1, al\xE9m: \u22126,2",en:"note at \u2264 \xBD: +3, \u2264 1: +1, \u2264 1\xBD: \u22124.1, beyond: \u22126.2"},"cwave.shift":{pt:"Desfasamento horizontal",en:"Horizontal shift"},"cwave.phase":{pt:"fase de {deg}\xB0",en:"phase {deg}\xB0"},"consts.range":{pt:"\xC2mbito atrator (\xB1 meios-tons \xE0 volta do L\xE14)",en:"Attracting range (\xB1 semitones around A4)"},"consts.rangeHint":{pt:"original: 15 (+10 nas primeiras avalia\xE7\xF5es)",en:"original: 15 (+10 in the first evaluations)"},"consts.balMin":{pt:"Pausas + prolongamentos: m\xEDnimo (%)",en:"Rests + prolongations: minimum (%)"},"consts.balMinHint":{pt:"original: 7",en:"original: 7"},"consts.balMax":{pt:"Pausas + prolongamentos: m\xE1ximo (%)",en:"Rests + prolongations: maximum (%)"},"consts.balMaxHint":{pt:"original: 40 (real: 55\u201380 nas can\xE7\xF5es)",en:"original: 40 (real songs: 55\u201380)"},"cpreset.original":{pt:"Original (2020)",en:"Original (2020)"},"cpreset.original.hint":{pt:"Os valores do programa original. Com operadores de bits: ~2,7 notas por tempo, \xE2mbito de ~36 meios-tons, cr\xEDtico 0. Com operadores musicais: cr\xEDtico 0,95, mas raramente acaba na t\xF3nica (17 %) e continua denso (3 notas por tempo).",en:"The original program\u2019s values. With bit operators: ~2.7 notes per beat, a range of ~36 semitones, critic 0. With musical operators: critic 0.95, but it rarely ends on the tonic (17 %) and stays dense (3 notes per beat)."},"cpreset.song":{pt:"Can\xE7\xE3o popular",en:"Folk song"},"cpreset.song.hint":{pt:"Calibrada em can\xE7\xF5es populares reais (Essen). Com operadores musicais: cr\xEDtico 0,90, 75 % das caracter\xEDsticas no intervalo t\xEDpico das can\xE7\xF5es (reais: 85 %), acaba na t\xF3nica em 71 % (reais: 73 %), \xE2mbito ~10 meios-tons. Com operadores de bits: notas mais longas e \xE2mbito de ~14 meios-tons em vez de 36, mas o cr\xEDtico fica em 0 (os ataques fora do tempo e os saltos s\xE3o invis\xEDveis para as regras).",en:"Calibrated on real folk songs (Essen). With musical operators: critic 0.90, 75 % of the features in the songs\u2019 typical range (real: 85 %), ends on the tonic in 71 % (real: 73 %), range ~10 semitones. With bit operators: longer notes and a range of ~14 semitones instead of 36, but the critic stays at 0 (off-beat onsets and leaps are invisible to the rules)."},"cpreset.dance":{pt:"Dan\xE7a",en:"Dance"},"cpreset.dance.hint":{pt:"Calibrada em reels e hornpipes irlandeses e escoceses. Com operadores musicais: figura\xE7\xE3o r\xE1pida (2,5 notas por tempo; reais: 2,4), 72 % das caracter\xEDsticas no intervalo t\xEDpico das dan\xE7as (reais: 79 %), acaba na t\xF3nica em 75 %.",en:"Calibrated on Irish and Scottish reels and hornpipes. With musical operators: fast figuration (2.5 notes per beat; real: 2.4), 72 % of the features in the dances\u2019 typical range (real: 79 %), ends on the tonic in 75 %."},"cpreset.chorale":{pt:"Coral",en:"Chorale"},"cpreset.chorale.hint":{pt:"Calibrada em sopranos de corais de Bach. Com operadores musicais: movimento por grau conjunto (66 %; reais: 68 %), \xE2mbito ~8 meios-tons, final 3\u20132\u20131; ainda mais notas do que um coral (1,3 por tempo; reais: 0,9), o estilo mais dif\xEDcil de aproximar.",en:"Calibrated on Bach chorale sopranos. With musical operators: stepwise motion (66 %; real: 68 %), range ~8 semitones, 3\u20132\u20131 ending; still more notes than a chorale (1.3 per beat; real: 0.9), the hardest style to approach."},"weights.title":{pt:"Pesos das regras",en:"Rule weights"},"weights.intro":{pt:"Cada peso multiplica uma regra da aptid\xE3o; a 0 a regra n\xE3o conta. Carregue em \xAB?\xBB para ver o que a regra mede e como muda a melodia.",en:"Each weight multiplies one rule of the fitness; at 0 the rule does not count. Press \u201C?\u201D to see what the rule measures and how it changes the melody."},"weights.caps":{pt:"N\xE3o maximizar: cada regra conta s\xF3 at\xE9 ao seu valor t\xEDpico na m\xFAsica real (P75 de 6758 melodias)",en:"Do not maximise: each rule counts only up to its typical value in real music (P75 of 6758 melodies)"},"weights.help":{pt:"?",en:"?"},"weights.helpTitle":{pt:"O que faz esta regra",en:"What this rule does"},"weights.canonSuffix":{pt:" (com 2+ vozes)",en:" (with 2+ voices)"},"wpreset.default":{pt:"Por omiss\xE3o",en:"Default"},"wpreset.learned":{pt:"Aprendidos da m\xFAsica real",en:"Learned from real music"},"wpreset.counterpoint":{pt:"\xCAnfase no contraponto",en:"Emphasis on counterpoint"},"wpreset.waves":{pt:"\xCAnfase nas ondas",en:"Emphasis on the waves"},"weight.key":{pt:"Tonalidade (perfil K-K)",en:"Key (K-K profile)"},"weight.key.desc":{pt:"Mede quanto cada nota pertence \xE0 tonalidade: as notas da escala valem conforme a sua estabilidade no perfil de Krumhansl & Kessler (t\xF3nica, dominante e mediante valem mais), as notas fora da escala s\xE3o penalizadas, tudo pesado pela dura\xE7\xE3o. Mais peso: menos cromatismo e mais tempo nas notas est\xE1veis; a melodia soa mais tonal e segura. Menos peso: deixa entrar notas de fora (os operadores musicais j\xE1 escrevem na escala, por isso o efeito \xE9 sobretudo na popula\xE7\xE3o aleat\xF3ria).",en:"How much each note belongs to the key: scale notes score by their stability in the Krumhansl & Kessler profile (tonic, dominant and mediant score most), notes outside the scale are penalised, all weighted by duration. More weight: less chromaticism and more time on stable notes; the melody sounds more tonal and safe. Less weight: lets notes outside the key in (the musical operators already write in the scale, so the effect is mostly on the random population)."},"weight.attractor":{pt:"Bacias das ondas",en:"Wave basins"},"weight.attractor.desc":{pt:"A ideia central do trabalho original: cada nota \xE9 atra\xEDda pela onda mais pr\xF3xima e pontua mais quanto mais perto estiver do seu centro (bacia gaussiana, gravitacional ou em degraus); com v\xE1rias ondas, cada uma deve atrair parte das notas (melodia composta), e as notas fora do alcance do instrumento s\xE3o penalizadas. Mais peso: o contorno segue as ondas de perto (o arco, o seno ou o atrator ca\xF3tico escolhido); em excesso a melodia cola-se ao centro da onda e repete notas. Menos peso: as ondas s\xF3 sugerem o registo.",en:"The central idea of the original work: each note is attracted by the nearest wave and scores more the closer it is to the wave\u2019s centre (Gaussian, gravitational or stepped basin); with several waves, each one should attract part of the notes (compound melody), and notes outside the instrument\u2019s reach are penalised. More weight: the contour follows the waves closely (the arch, sine or chaotic attractor chosen); too much makes the melody stick to the wave\u2019s centre and repeat notes. Less weight: the waves only suggest the register."},"weight.proximity":{pt:"Proximidade (Temperley)",en:"Proximity (Temperley)"},"weight.proximity.desc":{pt:"Proximidade de altura (Temperley 2008): cada intervalo entre notas seguidas pontua numa curva gaussiana \u2014 graus conjuntos e saltos pequenos valem quase 1, saltos grandes valem pouco. Mais peso: melodia mais cant\xE1vel, por graus conjuntos; em excesso fica lisa demais, quase sem saltos (as heur\xEDsticas de composi\xE7\xE3o corrigem isto). Menos peso: saltos mais frequentes e maiores.",en:"Pitch proximity (Temperley 2008): each interval between consecutive notes scores on a Gaussian curve \u2014 steps and small leaps score almost 1, large leaps little. More weight: a more singable, stepwise melody; too much makes it too smooth, almost without leaps (the composition heuristics correct this). Less weight: more frequent and larger leaps."},"weight.regression":{pt:"Retorno ap\xF3s salto",en:"Return after a leap"},"weight.regression.desc":{pt:"Depois de um salto de 4.\xAA ou mais, a nota seguinte deve voltar para tr\xE1s com um intervalo pequeno (regress\xE3o para a m\xE9dia, von Hippel & Huron 2000; o \xABpreenchimento da lacuna\xBB de Meyer); saltos que continuam no mesmo sentido contam contra. Mais peso: saltos sempre compensados, contorno em ziguezague equilibrado. Menos peso: permite arpejos que sobem ou descem seguidos.",en:"After a leap of a fourth or more, the next note should turn back with a small interval (regression to the mean, von Hippel & Huron 2000; Meyer\u2019s \u201Cgap fill\u201D); leaps that carry on in the same direction count against. More weight: leaps always compensated, a balanced zig-zag contour. Less weight: allows arpeggios that keep rising or falling."},"weight.forces":{pt:"For\xE7as mel\xF3dicas",en:"Melodic forces"},"weight.forces.desc":{pt:"Magnetismo mel\xF3dico (Lerdahl 2001; Larson 2012): uma nota inst\xE1vel (fora da tr\xEDade da t\xF3nica) tende para a vizinha mais atraente \u2014 a sens\xEDvel para a t\xF3nica, o 4.\xBA grau para o 3.\xBA; a regra compara o passo dado com o mais atraente poss\xEDvel. Mais peso: resolu\xE7\xF5es de tend\xEAncia claras, sensa\xE7\xE3o de dire\xE7\xE3o tonal. Menos peso: as notas inst\xE1veis podem saltar ou ficar suspensas.",en:"Melodic magnetism (Lerdahl 2001; Larson 2012): an unstable note (outside the tonic triad) tends towards its most attracting neighbour \u2014 the leading tone to the tonic, the 4th degree to the 3rd; the rule compares the step taken with the most attracting one. More weight: clear tendency resolutions, a sense of tonal direction. Less weight: unstable notes may leap away or stay suspended."},"weight.metric":{pt:"Hierarquia m\xE9trica",en:"Metric hierarchy"},"weight.metric.desc":{pt:"Notas est\xE1veis (t\xF3nica, 3.\xAA, 5.\xAA) nos tempos fortes e sobretudo no 1.\xBA tempo do compasso (Lerdahl & Jackendoff 1983; Prince & Schmuckler 2014); notas longas a come\xE7ar numa semicolcheia fraca contam como s\xEDncopa e s\xE3o penalizadas. Mais peso: o compasso ouve-se melhor e a harmonia impl\xEDcita assenta nos tempos. Menos peso: mais liberdade r\xEDtmica e mel\xF3dica nos tempos fortes.",en:"Stable notes (tonic, 3rd, 5th) on strong beats, above all on the downbeat (Lerdahl & Jackendoff 1983; Prince & Schmuckler 2014); long notes starting on a weak sixteenth count as syncopation and are penalised. More weight: the meter is heard more clearly and the implied harmony sits on the beats. Less weight: more rhythmic and melodic freedom on the strong beats."},"weight.cadence":{pt:"Cad\xEAncias",en:"Cadences"},"weight.cadence.desc":{pt:"O fim de cada frase: a \xFAltima nota deve ser longa, chegar ao fim da frase e ser est\xE1vel; a frase final acaba na t\xF3nica (de prefer\xEAncia por grau descendente ou 5\u20131) e a frase do meio numa meia cad\xEAncia (5.\xBA grau). Mais peso: frases bem pontuadas, respira\xE7\xE3o clara, final conclusivo. Menos peso: frases que se encadeiam sem repouso.",en:"The end of each phrase: the last note should be long, reach the end of the phrase and be stable; the final phrase ends on the tonic (preferably by a falling step or 5\u20131) and the middle phrase on a half cadence (5th degree). More weight: well-punctuated phrases, clear breathing, a conclusive ending. Less weight: phrases that run on without rest."},"weight.rhythm":{pt:"Ritmo e pausas",en:"Rhythm and rests"},"weight.rhythm.desc":{pt:"Valores alinhados com o tempo (uma sem\xEDnima come\xE7a num tempo, uma colcheia numa colcheia; no compasso composto, as figuras do tempo de tr\xEAs colcheias), valores que se escrevem numa s\xF3 figura, semicolcheias em grupos (uma sozinha soa a erro), pausas at\xE9 ~8 % do tempo e entre 0,75 e 2 notas por tempo. Mais peso: ritmo mais limpo e de pauta, densidade moderada. Menos peso: ritmos mais irregulares, mais ou menos notas.",en:"Note values aligned with the beat (a quarter starts on a beat, an eighth on an eighth; in compound time, the figures of a three-eighth beat), values written as a single note, sixteenths in groups (a lone one sounds like a mistake), rests up to ~8 % of the time and 0.75\u20132 notes per beat. More weight: a cleaner, more written-out rhythm and moderate density. Less weight: more irregular rhythms, more or fewer notes."},"weight.form":{pt:"Forma",en:"Form"},"weight.form.desc":{pt:"A forma escolhida (A A\u2032 B A\u2032, A B A\u2032 C, A A B B\u2026): as partes com a mesma letra devem parecer-se no ritmo e no contorno (mesmo transpostas, o que d\xE1 sequ\xEAncias) sem serem c\xF3pias literais; letras diferentes devem contrastar. Mais peso: estrutura clara, reconhec\xEDvel \xE0 escuta, com repeti\xE7\xE3o e varia\xE7\xE3o. Menos peso: a melodia desenvolve-se livremente. Sem efeito com a forma \xABLivre\xBB.",en:"The chosen form (A A\u2032 B A\u2032, A B A\u2032 C, A A B B\u2026): parts with the same letter should resemble each other in rhythm and contour (even transposed, which gives sequences) without being literal copies; different letters should contrast. More weight: a clear structure you can hear, with repetition and variation. Less weight: the melody develops freely. No effect with the form \u201CFree\u201D."},"weight.tension":{pt:"Onda de tens\xE3o",en:"Tension wave"},"weight.tension.desc":{pt:"Uma curva de tens\xE3o (instabilidade tonal + altura + densidade de ataques) deve seguir um arco por frase e um arco global com o pico a ~62 % da pe\xE7a (Farbood 2012; Herremans & Chew 2017). Mais peso: a melodia cresce para um cl\xEDmax e relaxa no fim, frase a frase. Menos peso: a tens\xE3o distribui-se sem plano.",en:"A tension curve (tonal instability + pitch height + onset density) should follow an arch per phrase and a global arch peaking at ~62 % of the piece (Farbood 2012; Herremans & Chew 2017). More weight: the melody builds to a climax and relaxes at the end, phrase by phrase. Less weight: tension is spread without a plan."},"weight.variety":{pt:"Variedade",en:"Variety"},"weight.variety.desc":{pt:"Contra a monotonia (Towsey et al. 2001): penaliza a mesma nota tr\xEAs vezes seguidas e pede pelo menos 6 alturas diferentes, um cl\xEDmax que n\xE3o se repete muitas vezes, \xE2mbito entre uma 5.\xAA e uma 12.\xAA e pelo menos tr\xEAs dura\xE7\xF5es diferentes. Mais peso: melodias mais variadas em altura e ritmo. Menos peso: aceita melodias repetitivas (can\xE7\xF5es infantis, ostinatos).",en:"Against monotony (Towsey et al. 2001): penalises the same note three times in a row and asks for at least 6 different pitches, a climax not repeated many times, a range between a 5th and a 12th and at least three different durations. More weight: melodies more varied in pitch and rhythm. Less weight: accepts repetitive melodies (children\u2019s songs, ostinatos)."},"weight.canon":{pt:"Contraponto entre as vozes",en:"Counterpoint between the voices"},"weight.canon.desc":{pt:"S\xF3 com 2 ou 3 vozes: a melodia tocada contra si pr\xF3pria, com cada voz a entrar mais tarde e talvez transposta \u2014 conson\xE2ncias nos tempos fortes, sem quintas e oitavas paralelas, movimento contr\xE1rio, poucos un\xEDssonos e todas as vozes no alcance do seu instrumento (para todos os pares de vozes). Mais peso: c\xE2nones que soam bem a v\xE1rias vozes (\xE0 Telemann), \xE0 custa de alguma liberdade mel\xF3dica. Menos peso: a melodia sozinha manda.",en:"Only with 2 or 3 voices: the melody played against itself, each voice entering later and maybe transposed \u2014 consonances on strong beats, no parallel fifths and octaves, contrary motion, few unisons and every voice within its instrument\u2019s reach (for every pair of voices). More weight: canons that sound good in several voices (Telemann-style), at some cost to melodic freedom. Less weight: the melody alone decides."},"weight.idiom":{pt:"Idioma do corpus (blocos)",en:"Corpus idiom (blocks)"},"weight.idiom.desc":{pt:"Qu\xE3o t\xEDpicos s\xE3o os blocos de um tempo (figura r\xEDtmica, contorno, intervalo de entrada) nas melodias reais do mesmo compasso, at\xE9 \xE0 mediana do corpus. Mais peso: figuras mais parecidas com as reais do compasso, mas os estudos mostraram que baixa o cr\xEDtico (o AG escolhe os blocos mais comuns, que juntos soam menos naturais); por isso est\xE1 a 0 por omiss\xE3o.",en:"How typical the one-beat blocks (rhythmic figure, contour, entry interval) are of real melodies in the same meter, up to the corpus median. More weight: figures closer to real ones in that meter, but the studies showed it lowers the critic (the GA picks the most common blocks, which together sound less natural); so it is 0 by default."},"weight.heuristics":{pt:"Heur\xEDsticas de composi\xE7\xE3o",en:"Composition heuristics"},"weight.heuristics.desc":{pt:"Regras de composi\xE7\xE3o da literatura (results/estilos/literatura.csv), cada uma medida na melodia e comparada com o intervalo P10\u2013P90 da m\xFAsica real: mais graus a descer do que a subir, in\xE9rcia do grau, saltos nem de menos nem de mais, saltos compensados, saltos seguidos s\xF3 em arpejo, sem intervalos dissonantes, \xE2mbito, cl\xEDmax, arco de frase, fim de frase mais grave e mais longo, motivos r\xEDtmicos repetidos, notas longas nos tempos e sem s\xEDncopas. Com um estilo escolhido junta as regras desse estilo (figuras, anacrusa, densidade\u2026) e o peso nunca fica a 0. Mais peso: a melodia aproxima-se do estilo ou das tend\xEAncias gerais da m\xFAsica real. A 0 e sem estilo n\xE3o conta.",en:"Composition rules from the literature (results/estilos/literatura.csv), each measured on the melody and compared with the P10\u2013P90 range of real music: more falling than rising steps, step inertia, neither too few nor too many leaps, compensated leaps, consecutive leaps only as arpeggios, no dissonant intervals, range, climax, phrase arch, phrase endings lower and longer, repeated rhythmic motifs, long notes on beats and no syncopation. With a style chosen it adds that style\u2019s rules (figures, pickup, density\u2026) and the weight never stays at 0. More weight: the melody moves towards the style or the general tendencies of real music. At 0 and without a style it does not count."},"classic.weights.intro":{pt:"As regras do programa original (AlgorithmFitness.cs). As descri\xE7\xF5es dizem o que cada regra faz no c\xF3digo e interpretam o que os autores pretendiam, pelos nomes, pelos coment\xE1rios e pelos valores que escolheram.",en:"The rules of the original program (AlgorithmFitness.cs). The descriptions say what each rule does in the code and interpret what the authors intended, from the names, the comments and the values they chose."},"classic.groups.desc":{pt:"O original usava dois grupos de pesos: o 1.\xBA nos primeiros 25 % do tempo de execu\xE7\xE3o (aqui, das gera\xE7\xF5es) e o 2.\xBA no resto. Inten\xE7\xE3o prov\xE1vel: primeiro p\xF4r as notas no registo e na escala e s\xF3 depois refinar a forma \u2014 o 2.\xBA grupo d\xE1 mais peso \xE0 escala, aos intervalos, ao leitmotiv e ao equil\xEDbrio de notas e pausas.",en:"The original used two groups of weights: the 1st in the first 25 % of the run time (here, of the generations) and the 2nd for the rest. Likely intention: first get the notes into the register and the scale, and only then refine the form \u2014 the 2nd group gives more weight to the scale, the intervals, the leitmotif and the balance of notes and rests."},"weights.group1":{pt:"Grupo 1 (primeiros {pct} % das gera\xE7\xF5es)",en:"Group 1 (first {pct} % of the generations)"},"weights.group2":{pt:"Grupo 2 (resto)",en:"Group 2 (the rest)"},"classic.rhythmicPatterns":{pt:"Padr\xF5es r\xEDtmicos",en:"Rhythmic patterns"},"classic.rhythmicPatterns.desc":{pt:"Valoriza figuras de um tempo: 3+1 e 2+1+1 semicolcheias (+1, e +5 quando come\xE7am no in\xEDcio do compasso), quatro semicolcheias (+0,5) e um tempo inteiro numa s\xF3 nota ou pausa (+10); penaliza um prolongamento no in\xEDcio do compasso (\u22125). Inten\xE7\xE3o dos autores (coment\xE1rio no C#: \xABvaloriza\xE7\xE3o de figuras r\xEDtmicas\xBB): dar \xE0 melodia figuras reconhec\xEDveis e alinhadas com o compasso, em vez de semicolcheias soltas. Mais peso: mais figuras de tempo e notas de um tempo inteiro. Com \xABCorrigir os lapsos\xBB o b\xF3nus do in\xEDcio do compasso passa a contar na semicolcheia certa.",en:"Rewards one-beat figures: 3+1 and 2+1+1 sixteenths (+1, and +5 when they start at the beginning of the bar), four sixteenths (+0.5) and a whole beat as one note or rest (+10); penalises a prolongation at the start of a bar (\u22125). The authors\u2019 intention (C# comment: \u201Cvaluing rhythmic figures\u201D): give the melody recognisable figures aligned with the bar instead of scattered sixteenths. More weight: more beat-long figures and whole-beat notes. With \u201CFix the original\u2019s lapses\u201D the start-of-bar bonus counts on the right sixteenth."},"classic.selfHarm1":{pt:"Auto-harmoniza\xE7\xE3o (2.\xAA voz)",en:"Self-harmonisation (2nd voice)"},"classic.selfHarm1.desc":{pt:"Compara cada nota com a que soa um compasso antes (ou \xE0 dist\xE2ncia a que entra a 2.\xAA voz) e pontua o intervalo harm\xF3nico: 3.as +3 (conforme o modo), 4.as +2, 5.as +1,5, 8.as e 7.as menores +1, un\xEDssonos \u22124,5, 2.as, 6.as e 7.as maiores negativas. Inten\xE7\xE3o dos autores (coment\xE1rio: \xABharmoniza\xE7\xE3o entre compassos subsequentes\xBB): que a melodia soe bem contra si pr\xF3pria desfasada, como num c\xE2none, sem ter de guardar uma 2.\xAA voz no cromossoma. Mais peso: compassos seguidos mais consonantes entre si. Nota: premeia 4.as e penaliza 6.as, ao contr\xE1rio do contraponto cl\xE1ssico; no original compara genes e n\xE3o as notas que soam (corrigido com \xABCorrigir os lapsos\xBB).",en:"Compares each note with the one sounding a bar earlier (or at the distance where the 2nd voice enters) and scores the harmonic interval: 3rds +3 (depending on the mode), 4ths +2, 5ths +1.5, octaves and minor 7ths +1, unisons \u22124.5, 2nds, 6ths and major 7ths negative. The authors\u2019 intention (comment: \u201Charmonisation between subsequent bars\u201D): make the melody sound good against itself shifted, as in a canon, without storing a 2nd voice in the chromosome. More weight: consecutive bars more consonant with each other. Note: it rewards 4ths and penalises 6ths, unlike classical counterpoint; the original compares genes rather than the sounding notes (fixed with \u201CFix the original\u2019s lapses\u201D)."},"classic.selfHarm2":{pt:"Auto-harmoniza\xE7\xE3o (3.\xAA voz)",en:"Self-harmonisation (3rd voice)"},"classic.selfHarm2.desc":{pt:"A mesma regra a dois compassos de dist\xE2ncia (ou \xE0 dist\xE2ncia a que entra a 3.\xAA voz). Inten\xE7\xE3o: um c\xE2none ou ronda a tr\xEAs vozes em que a melodia tamb\xE9m soa bem contra si pr\xF3pria dois compassos depois. Mais peso: conson\xE2ncia tamb\xE9m entre compassos alternados. O peso original (1\u20134) \xE9 mais alto do que o da 2.\xAA voz.",en:"The same rule two bars apart (or at the distance where the 3rd voice enters). Intention: a canon or round in three voices where the melody also sounds good against itself two bars later. More weight: consonance also between alternate bars. The original weight (1\u20134) is higher than the 2nd voice\u2019s."},"classic.aba":{pt:"Repeti\xE7\xE3o a 4 compassos",en:"Repetition 4 bars apart"},"classic.aba.desc":{pt:"Cada semicolcheia igual \xE0 de quatro compassos antes vale +1; diferente, \u22124. Inten\xE7\xE3o dos autores (coment\xE1rio: \xABrepeti\xE7\xF5es de padr\xF5es alternadamente entre compassos\xBB, com uma vers\xE3o espelhada prevista mas n\xE3o feita): uma forma em que a 2.\xAA metade de 8 compassos repete a 1.\xAA, como A\u2026A. Mais peso: repeti\xE7\xE3o literal a 4 compassos (com peso alto a pe\xE7a divide-se em duas metades iguais). Com o peso original (0,5) quase n\xE3o conta.",en:"Each sixteenth equal to the one four bars earlier scores +1; different, \u22124. The authors\u2019 intention (comment: \u201Crepetitions of patterns alternately between bars\u201D, with a mirrored version planned but never done): a form where the second half of 8 bars repeats the first, like A\u2026A. More weight: literal repetition four bars apart (at high weight the piece splits into two equal halves). At the original weight (0.5) it barely counts."},"classic.leitmotif":{pt:"Leitmotiv r\xEDtmico",en:"Rhythmic leitmotif"},"classic.leitmotif.desc":{pt:"Compara o ritmo de cada compasso com o do 1.\xBA compasso, semicolcheia a semicolcheia (pausa com pausa +4, prolongamento com prolongamento +4, ataque com ataque +2, diferente \u22122). Inten\xE7\xE3o dos autores (coment\xE1rio: \xABLeitMotif \u2014 repeti\xE7\xE3o de uma figura r\xEDtmica ao longo da partitura\xBB): um motivo r\xEDtmico que unifica a pe\xE7a. Mais peso: os compassos ficam com o ritmo do primeiro (com peso alto, mon\xF3tono). \xC9 um dos pesos mais altos do original (12\u201316).",en:"Compares the rhythm of each bar with that of bar 1, sixteenth by sixteenth (rest with rest +4, prolongation with prolongation +4, onset with onset +2, different \u22122). The authors\u2019 intention (comment: \u201CLeitMotif \u2014 repetition of a rhythmic figure throughout the score\u201D): a rhythmic motif that unifies the piece. More weight: the bars take the rhythm of the first (monotonous at high weight). One of the original\u2019s highest weights (12\u201316)."},"classic.wave1":{pt:"Onda 1",en:"Wave 1"},"classic.wave1.desc":{pt:"A ideia central do trabalho: cada nota perto da onda 1 (um seno lento: por omiss\xE3o 1 ciclo em 2 compassos, \xB112 meios-tons \xE0 volta do L\xE14) ganha pontos (a \u2264 \xBD bacia +3, \u2264 1 bacia +1) e longe perde (\u22124,1 e \u22126,2). Inten\xE7\xE3o dos autores (coment\xE1rio: \xABas notas convergem para os limites de atra\xE7\xE3o de ondas de oscila\xE7\xE3o de refer\xEAncia\xBB): um contorno de fundo em onda, que as notas seguem de perto. Mais peso: o contorno segue a onda; como s\xF3 as notas s\xE3o avaliadas, com peso alto o AG foge para pausas e prolongamentos (ver \xABSobre\xBB).",en:"The central idea of the work: each note near wave 1 (a slow sine: by default 1 cycle in 2 bars, \xB112 semitones around A4) gains points (within \xBD basin +3, within the basin +1) and far away loses them (\u22124.1 and \u22126.2). The authors\u2019 intention (comment: \u201Cthe notes converge to the attraction limits of reference oscillation waves\u201D): a wave-shaped background contour that the notes follow closely. More weight: the contour follows the wave; since only notes are judged, at high weight the GA escapes into rests and prolongations (see \u201CAbout\u201D)."},"classic.wave2":{pt:"Onda 2",en:"Wave 2"},"classic.wave2.desc":{pt:"O mesmo para a onda 2 (um seno r\xE1pido: 2 ciclos por compasso, \xB14 meios-tons \xE0 volta do R\xE94). As duas ondas somam as penaliza\xE7\xF5es: uma nota tem de estar perto das duas ao mesmo tempo. Inten\xE7\xE3o: uma ondula\xE7\xE3o curta sobreposta \xE0 longa (o motivo sobre a frase). Mais peso: movimento ondulado r\xE1pido, dentro de um registo estreito.",en:"The same for wave 2 (a fast sine: 2 cycles per bar, \xB14 semitones around D4). The two waves add their penalties: a note must be near both at once. Intention: a short undulation over the long one (the motif over the phrase). More weight: fast wavy motion within a narrow register."},"classic.range":{pt:"\xC2mbito",en:"Range"},"classic.range.desc":{pt:"Notas a menos de \xB115 meios-tons do L\xE14 (a constante \xAB\xC2mbito atrator\xBB) valem +2; mais longe, \u22121 a \u22122 (e \u221215 nos genes mais graves); pausas e prolongamentos +1. Nas primeiras avalia\xE7\xF5es o \xE2mbito \xE9 10 meios-tons mais largo. Inten\xE7\xE3o dos autores (coment\xE1rio: \xABd\xE1 classifica\xE7\xE3o positiva a notas dentro do intervalo selecionado\xBB): manter a melodia num registo cant\xE1vel e toc\xE1vel. \xC9 o peso mais alto do original (42). Mais peso: registo mais contido.",en:"Notes within \xB115 semitones of A4 (the \u201Cattracting range\u201D constant) score +2; further away, \u22121 to \u22122 (and \u221215 for the lowest genes); rests and prolongations +1. In the first evaluations the range is 10 semitones wider. The authors\u2019 intention (comment: \u201Cpositive score for notes inside the selected interval\u201D): keep the melody in a singable, playable register. It is the original\u2019s highest weight (42). More weight: a more contained register."},"classic.scale":{pt:"Escala",en:"Scale"},"classic.scale.desc":{pt:"Cada nota da escala escolhida vale +1, cada nota fora dela \u22121,5. Inten\xE7\xE3o dos autores (coment\xE1rio: \xABd\xE1 classifica\xE7\xE3o positiva \xE0s notas da escala selecionada\xBB): melodias tonais, na tonalidade escolhida no formul\xE1rio. Mais peso: menos notas crom\xE1ticas. Com os operadores de bits, que escrevem qualquer um dos 73 meios-tons, \xE9 a regra que mais trabalha.",en:"Each note of the chosen scale scores +1, each note outside it \u22121.5. The authors\u2019 intention (comment: \u201Cpositive score for the notes of the selected scale\u201D): tonal melodies in the key chosen in the form. More weight: fewer chromatic notes. With the bit operators, which write any of the 73 semitones, this is the rule that works hardest."},"classic.pauseProlongation":{pt:"Pausas e prolongamentos",en:"Rests and prolongations"},"classic.pauseProlongation.desc":{pt:"Pontos por uma pausa depois de uma nota (+4), pelo prolongamento de uma pausa (+6,5) e de uma nota (+2), \u22121 no resto, at\xE9 ao m\xE1ximo de 40; \u221210 se a pe\xE7a come\xE7ar num prolongamento. Inten\xE7\xE3o dos autores (coment\xE1rio: \xABclassifica\xE7\xE3o merit\xF3ria\xBB de pausas e prolongamentos): contrariar a densidade do ru\xEDdo inicial, que \xE9 quase s\xF3 ataques, e dar respira\xE7\xE3o e notas longas. Mais peso: mais pausas e notas longas, at\xE9 ao teto de 40. O ramo \xABprolongamento de prolongamento\xBB (+0,5) nunca era alcan\xE7ado (corrigido com \xABCorrigir os lapsos\xBB).",en:"Points for a rest after a note (+4), for the prolongation of a rest (+6.5) and of a note (+2), \u22121 otherwise, up to a maximum of 40; \u221210 if the piece starts with a prolongation. The authors\u2019 intention (comment: \u201Cmerit score\u201D for rests and prolongations): counter the density of the initial noise, which is almost all onsets, and give breathing space and long notes. More weight: more rests and long notes, up to the cap of 40. The \u201Cprolongation of a prolongation\u201D branch (+0.5) was never reached (fixed with \u201CFix the original\u2019s lapses\u201D)."},"classic.reduceRepetitions":{pt:"Repeti\xE7\xF5es excessivas",en:"Excessive repetitions"},"classic.reduceRepetitions.desc":{pt:"Penaliza a mesma nota repetida: duas vezes \u22121,8, tr\xEAs \u22123, quatro ou mais \u22126 (tamb\xE9m depois de um prolongamento). Inten\xE7\xE3o dos autores (coment\xE1rio: \xABrepeti\xE7\xF5es exageradas das mesmas notas\xBB): evitar melodias presas numa nota, que as ondas tendem a produzir. Mais peso: menos notas repetidas.",en:"Penalises the same note repeated: twice \u22121.8, three times \u22123, four or more \u22126 (also after a prolongation). The authors\u2019 intention (comment: \u201Cexaggerated repetitions of the same notes\u201D): avoid melodies stuck on one note, which the waves tend to produce. More weight: fewer repeated notes."},"classic.intervals":{pt:"Intervalos",en:"Intervals"},"classic.intervals.desc":{pt:"Pontua cada intervalo mel\xF3dico: 3.as no sentido do modo (+3) e arpejos da tr\xEDade (+5), o tom inteiro (+2), 4.as (+1), 5.as (+0,5) e oitavas (+1); penaliza un\xEDssonos (\u22124,5), meios-tons (\u22121), tr\xEDtonos, 6.as e 7.as (\u22120,3 a \u22121) e saltos maiores do que a oitava (\u22121). Inten\xE7\xE3o dos autores (coment\xE1rio: \xABintervalos entre notas v\xE1lidos e apraz\xEDveis\xBB; a tabela distingue o modo maior e o menor): uma melodia de intervalos agrad\xE1veis, com arpejos da tr\xEDade. Mais peso: mais terceiras e arpejos, menos notas repetidas. No original s\xF3 media semicolcheias vizinhas (com notas longas nunca julgava a melodia); com \xABCorrigir os lapsos\xBB mede entre notas seguidas.",en:"Scores each melodic interval: thirds in the direction of the mode (+3) and triad arpeggios (+5), the whole tone (+2), fourths (+1), fifths (+0.5) and octaves (+1); penalises unisons (\u22124.5), semitones (\u22121), tritones, sixths and sevenths (\u22120.3 to \u22121) and leaps beyond the octave (\u22121). The authors\u2019 intention (comment: \u201Cvalid and pleasing intervals between notes\u201D; the table distinguishes major and minor mode): a melody of pleasant intervals, with triad arpeggios. More weight: more thirds and arpeggios, fewer repeated notes. The original only measured neighbouring sixteenths (with long notes it never judged the melody); with \u201CFix the original\u2019s lapses\u201D it measures between consecutive notes."},"classic.niceRepetitions":{pt:"Repeti\xE7\xF5es interessantes",en:"Interesting repetitions"},"classic.niceRepetitions.desc":{pt:"Premeia padr\xF5es de notas alternadas: a mesma nota duas posi\xE7\xF5es depois (x y x: +2) ou tr\xEAs posi\xE7\xF5es depois (x y z x: +1). Inten\xE7\xE3o dos autores (coment\xE1rio: \xABcad\xEAncias de repeti\xE7\xF5es interessantes\xBB): bordaduras e figuras que voltam \xE0 nota de partida, que d\xE3o interesse sem repetir a mesma nota seguida. Mais peso: mais figuras \xE0 volta de uma nota. No original tamb\xE9m contava prolongamentos como notas (a condi\xE7\xE3o que os autores corrigiram nos intervalos); corrigido com \xABCorrigir os lapsos\xBB.",en:"Rewards patterns of alternating notes: the same note two positions later (x y x: +2) or three positions later (x y z x: +1). The authors\u2019 intention (comment: \u201Ccadences of interesting repetitions\u201D): neighbour notes and figures that return to their starting note, which add interest without repeating the same note in a row. More weight: more figures around a note. The original also counted prolongations as notes (the condition the authors fixed in the intervals rule); fixed with \u201CFix the original\u2019s lapses\u201D."},"classic.ending":{pt:"Final (nota longa)",en:"Ending (long note)"},"classic.ending.desc":{pt:"Premeia uma \xFAltima nota prolongada: +10 % do comprimento da pe\xE7a se o \xFAltimo gene for um prolongamento, mais 20 % e 30 % conforme os dois genes anteriores. Inten\xE7\xE3o dos autores (coment\xE1rio: \xABtermina\xE7\xE3o da partitura com notas mais longas\xBB): um final que repousa. Nota: os testes aninhados perguntam se os genes anteriores N\xC3O s\xE3o prolongamentos, por isso a pontua\xE7\xE3o m\xE1xima vai para uma nota final de s\xF3 duas semicolcheias \u2014 provavelmente uma troca de \xAB==\xBB por \xAB!=\xBB, como noutras regras; fica como no original. O relat\xF3rio previa tamb\xE9m f\xF3rmulas de final, que ficaram por fazer: ver \xABF\xF3rmulas de final\xBB.",en:"Rewards a prolonged last note: +10 % of the piece\u2019s length if the last gene is a prolongation, a further 20 % and 30 % depending on the two genes before it. The authors\u2019 intention (comment: \u201Cending the score with longer notes\u201D): an ending that comes to rest. Note: the nested tests ask whether the previous genes are NOT prolongations, so the top score goes to a final note of only two sixteenths \u2014 probably \u201C==\u201D swapped for \u201C!=\u201D, as in other rules; it is kept as in the original. The report also planned ending formulas, which were never done: see \u201CEnding formulas\u201D."},"classic.balance":{pt:"Equil\xEDbrio notas/pausas",en:"Balance of notes and rests"},"classic.balance.desc":{pt:"Mede a percentagem de semicolcheias sem ataque (pausas + prolongamentos) e premeia valores entre o m\xEDnimo e o m\xE1ximo das constantes (7 % e 40 % no original), com uma par\xE1bola que penaliza cada vez mais fora do intervalo. Inten\xE7\xE3o dos autores: equilibrar ataques e sustenta\xE7\xF5es, nem s\xF3 semicolcheias nem s\xF3 notas longas. Nota: nas melodias reais esse valor \xE9 58\u201383 %, por isso os valores originais pedem melodias 2\u20133 vezes mais densas do que as reais; as combina\xE7\xF5es de partida calibradas corrigem o intervalo. Sem pausas nem prolongamentos o original dava \u2212\u221E (corrigido com \xABCorrigir os lapsos\xBB).",en:"Measures the percentage of sixteenths without an onset (rests + prolongations) and rewards values between the minimum and the maximum of the constants (7 % and 40 % in the original), with a parabola that penalises more and more outside the range. The authors\u2019 intention: balance onsets and sustains, neither all sixteenths nor all long notes. Note: in real melodies this value is 58\u201383 %, so the original values ask for melodies 2\u20133 times denser than real ones; the calibrated starting combinations correct the range. With no rests or prolongations the original gave \u2212\u221E (fixed with \u201CFix the original\u2019s lapses\u201D)."},"classic.cadence":{pt:"F\xF3rmulas de final (corpus)",en:"Ending formulas (corpus)"},"classic.cadence.desc":{pt:"N\xE3o existia no original (peso 0): completa a regra do final com a probabilidade do fim da pe\xE7a segundo 6758 melodias reais \u2014 graus das tr\xEAs \xFAltimas notas (3\u20132\u20131, 2\u20132\u20131, 7\u20131\u2026), \xFAltimo movimento, tempo e dura\xE7\xE3o da \xFAltima nota e o seu registo. \xC9 o que o relat\xF3rio original previa e ficou por fazer. Mais peso: finais que soam conclusivos, na t\xF3nica.",en:"Not in the original (weight 0): completes the ending rule with the probability of the piece\u2019s ending according to 6758 real melodies \u2014 degrees of the last three notes (3\u20132\u20131, 2\u20132\u20131, 7\u20131\u2026), last motion, beat and length of the last note and its register. It is what the original report planned and never did. More weight: endings that sound conclusive, on the tonic."},"classic.heuristics":{pt:"Heur\xEDsticas de composi\xE7\xE3o",en:"Composition heuristics"},"classic.heuristics.desc":{pt:"N\xE3o existia no original (peso 0): as heur\xEDsticas de composi\xE7\xE3o do campo de atratores \u2014 regras gerais da literatura e, com um estilo em 4/4, as desse estilo \u2014 somadas por tempo, como as outras regras. Com um estilo escolhido o peso fica sempre acima de 0. Mais peso: a melodia aproxima-se das tend\xEAncias da m\xFAsica real ou do estilo.",en:"Not in the original (weight 0): the composition heuristics of the attractor field \u2014 general rules from the literature and, with a 4/4 style, that style\u2019s rules \u2014 summed per beat, like the other rules. With a style chosen the weight always stays above 0. More weight: the melody moves towards the tendencies of real music or towards the style."},"style.label":{pt:"Estilo",en:"Style"},"style.none":{pt:"Nenhum (s\xF3 as regras gerais)",en:"None (general rules only)"},"style.family.trad":{pt:"Can\xE7\xF5es",en:"Songs"},"style.family.fado":{pt:"Fado",en:"Fado"},"style.family.dance":{pt:"Dan\xE7as",en:"Dances"},"style.family.baroque":{pt:"Renascen\xE7a e barroco",en:"Renaissance and Baroque"},"style.family.classical":{pt:"T\xF3picos cl\xE1ssicos",en:"Classical topics"},"style.family.popular":{pt:"M\xFAsica popular do s\xE9c. XX",en:"20th-century popular music"},"style.hint.none":{pt:"Sem estilo: com o peso \xABHeur\xEDsticas de composi\xE7\xE3o\xBB acima de 0 contam s\xF3 as regras gerais (graus a descer, saltos, arco, fim de frase, motivos\u2026).",en:"No style: with the \u201CComposition heuristics\u201D weight above 0 only the general rules count (falling steps, leaps, arch, phrase endings, motifs\u2026)."},"style.hint.meters":{pt:"Compassos do estilo: {meters}.",en:"Meters of the style: {meters}."},"style.hint.mode.minor":{pt:"Costuma ser em modo menor.",en:"Usually in minor."},"style.hint.mode.major":{pt:"Costuma ser em modo maior.",en:"Usually in major."},"style.hint.forced":{pt:"Com um estilo, o peso \xABHeur\xEDsticas de composi\xE7\xE3o\xBB fica sempre acima de 0 (escolha \xABNenhum\xBB para o poder p\xF4r a 0).",en:"With a style, the \u201CComposition heuristics\u201D weight always stays above 0 (choose \u201CNone\u201D to be able to set it to 0)."},"style.hint.changed":{pt:"Ajustado para o estilo: {list}.",en:"Adjusted for the style: {list}."},"style.changed.meter":{pt:"compasso {v}",en:"time signature {v}"},"style.changed.phraseBars":{pt:"frases de {v} c.",en:"{v}-bar phrases"},"style.changed.form":{pt:"forma {v}",en:"form {v}"},"style.changed.bars":{pt:"{v} compassos",en:"{v} bars"},"style.changed.bpm":{pt:"andamento {v}",en:"tempo {v}"},"style.hint.classic":{pt:"O modelo cl\xE1ssico s\xF3 escreve em 4/4: os estilos noutros compassos s\xF3 existem no campo de atratores.",en:"The classic model only writes in 4/4: styles in other meters exist only in the attractor field."},"style.hint.rules":{pt:"{n} regras ({own} do estilo, {cal} medidas em melodias reais).",en:"{n} rules ({own} of the style, {cal} measured on real melodies)."},"style.onlyField":{pt:"{name} (s\xF3 no campo de atratores)",en:"{name} (attractor field only)"},"style.folk":{pt:"Can\xE7\xE3o popular europeia",en:"European folk song"},"style.folk.desc":{pt:"Can\xE7\xF5es do Essen (sobretudo alem\xE3s): intervalos pequenos, arco de frase, fim de frase mais longo e mais grave; intervalos-alvo medidos em 6547 can\xE7\xF5es reais do compasso escolhido.",en:"Essen songs (mostly German): small intervals, arched phrases, longer and lower phrase endings; target ranges measured on 6,547 real songs in the chosen meter."},"style.children":{pt:"Can\xE7\xE3o infantil (Kod\xE1ly)",en:"Children\u2019s song (Kod\xE1ly)"},"style.children.desc":{pt:"\xC2mbito estreito (at\xE9 uma 6.\xAA), escala pentat\xF3nica com o sol\u2013mi, motivos muito repetidos e poucos saltos grandes.",en:"Narrow range (up to a 6th), pentatonic scale with sol\u2013mi, highly repeated motifs and few large leaps."},"style.lullaby":{pt:"Can\xE7\xE3o de embalar",en:"Lullaby"},"style.lullaby.desc":{pt:"Lenta, por graus conjuntos, com poucas mudan\xE7as de dire\xE7\xE3o e frases que descem, balan\xE7o em 6/8 (sem\xEDnima + colcheia) e muita repeti\xE7\xE3o (Unyk, Trehub et al.; Mehr et al.).",en:"Slow, stepwise, with few changes of direction and falling phrases, a 6/8 rocking (quarter + eighth) and much repetition (Unyk, Trehub et al.; Mehr et al.)."},"style.hymn":{pt:"Hino (m\xE9trica comum)",en:"Hymn (common metre)"},"style.hymn.desc":{pt:"Anacrusa de um tempo, uma nota por tempo (sem\xEDnimas), graus conjuntos, \xE2mbito de uma oitava, quatro frases.",en:"A one-beat pickup, one note per beat (quarters), steps, a range of an octave, four phrases."},"style.pentatonic":{pt:"Can\xE7\xE3o pentat\xF3nica (China, Han)",en:"Pentatonic song (Han Chinese)"},"style.pentatonic.desc":{pt:"S\xF3 os cinco graus da pentat\xF3nica (d\xF3\u2013r\xE9\u2013mi\u2013sol\u2013l\xE1), sem meios-tons, \xE2mbito moderado.",en:"Only the five degrees of the pentatonic scale (do\u2013re\u2013mi\u2013sol\u2013la), no semitones, moderate range."},"style.fado":{pt:"Fado triste (menor)",en:"Sad fado (minor)"},"style.fado.desc":{pt:"A saudade, o mar e a espera: versos separados por respira\xE7\xF5es, cada um a acabar numa nota longa e suspensa (antecipada meio tempo), alcan\xE7ada por um grau a descer; a t\xF3nica guardada para o fim da estrofe; recita\xE7\xE3o em notas repetidas; poucas notas r\xE1pidas, e s\xF3 como ornamento. Tocado com din\xE2mica.",en:"Saudade, the sea and the waiting: verses separated by breaths, each ending on a long held note (sung half a beat early) reached by a falling step; the tonic kept for the end of the stanza; recitation on repeated notes; few fast notes, and only as ornaments. Played with dynamics."},"style.fadoAlegre":{pt:"Fado alegre (maior)",en:"Happy fado (major)"},"style.fadoAlegre.desc":{pt:"O Fado Corrido, \xABUma Casa Portuguesa\xBB, \xABA Casa da Mariquinhas\xBB: a mesma carga emotiva, em modo maior e andamento vivo, com as notas longas no tempo, a convidar a dan\xE7ar; menos respira\xE7\xF5es e suspens\xF5es do que no fado triste. Tocado com din\xE2mica.",en:"The Fado Corrido, \u201CUma Casa Portuguesa\u201D, \u201CA Casa da Mariquinhas\u201D: the same emotional charge in a major key and a lively tempo, the long notes on the beat, an invitation to dance; fewer breaths and suspensions than the sad fado. Played with dynamics."},"style.reel":{pt:"Reel (Irlanda, Esc\xF3cia)",en:"Reel (Ireland, Scotland)"},"style.reel.desc":{pt:"4/4 sentido a dois tempos, colcheias cont\xEDnuas (\u2248 77 % dos tempos), arpejos, sem pausas, duas partes de 8 compassos (AABB); medido em 264 reels reais.",en:"4/4 felt in two, running eighths (\u2248 77 % of the beats), arpeggios, no rests, two 8-bar strains (AABB); measured on 264 real reels."},"style.jig":{pt:"Double jig (Irlanda)",en:"Double jig (Ireland)"},"style.jig.desc":{pt:"6/8 com tr\xEAs colcheias em quase todos os tempos e sem\xEDnima + colcheia de vez em quando; AABB; medido em 219 jigs reais.",en:"6/8 with three eighths on almost every beat and quarter + eighth now and then; AABB; measured on 219 real jigs."},"style.singleJig":{pt:"Single jig / slide",en:"Single jig / slide"},"style.singleJig.desc":{pt:"6/8 ou 12/8 com o padr\xE3o longo-curto sem\xEDnima + colcheia na maior parte dos tempos.",en:"6/8 or 12/8 with the long-short quarter + eighth pattern on most beats."},"style.slipJig":{pt:"Slip jig (Irlanda)",en:"Slip jig (Ireland)"},"style.slipJig.desc":{pt:"9/8: tr\xEAs tempos de tr\xEAs colcheias, com sem\xEDnima + colcheia; medido em 138 melodias reais em 9/8.",en:"9/8: three beats of three eighths, with quarter + eighth; measured on 138 real tunes in 9/8."},"style.hornpipe":{pt:"Hornpipe",en:"Hornpipe"},"style.hornpipe.desc":{pt:"4/4 com pares pontuados (colcheia pontuada + semicolcheia) e o fim de cada parte em tr\xEAs sem\xEDnimas (\xABpom-pom-pom\xBB); medido em 166 hornpipes reais.",en:"4/4 with dotted pairs (dotted eighth + sixteenth) and each strain ending on three quarter notes (\u201Cpom-pom-pom\u201D); measured on 166 real hornpipes."},"style.strathspey":{pt:"Strathspey (Esc\xF3cia)",en:"Strathspey (Scotland)"},"style.strathspey.desc":{pt:"4/4 com pontuados dos dois tipos: longo-curto e o \xABScotch snap\xBB curto-longo (semicolcheia + colcheia pontuada); medido em 70 strathspeys reais.",en:"4/4 with both kinds of dotted rhythm: long-short and the short-long \u201CScotch snap\u201D (sixteenth + dotted eighth); measured on 70 real strathspeys."},"style.polka":{pt:"Polca / corridinho / malh\xE3o",en:"Polka / corridinho / malh\xE3o"},"style.polka.desc":{pt:"2/4 vivo com figuras colcheia + duas semicolcheias (\xABr\xE1pido-r\xE1pido-lento\xBB), frases de 4 compassos e muita repeti\xE7\xE3o.",en:"Lively 2/4 with eighth + two sixteenths figures (\u201Cquick-quick-slow\u201D), 4-bar phrases and much repetition."},"style.march":{pt:"Marcha",en:"March"},"style.march.desc":{pt:"2/4, 6/8 ou 4/4, ritmos pontuados, arpejos da tr\xEDade (como os toques de clarim), notas longas nos tempos fortes; medido em marchas e \xABquick steps\xBB reais.",en:"2/4, 6/8 or 4/4, dotted rhythms, arpeggios of the triad (like bugle calls), long notes on strong beats; measured on real marches and quick steps."},"style.waltz":{pt:"Valsa",en:"Waltz"},"style.waltz.desc":{pt:"3/4 com uma nota longa no 1.\xBA tempo em muitos compassos, poucas notas por compasso, saltos expressivos, frases de 4 compassos.",en:"3/4 with a long note on the downbeat in many bars, few notes per bar, expressive leaps, 4-bar phrases."},"style.mazurka":{pt:"Mazurca",en:"Mazurka"},"style.mazurka.desc":{pt:"3/4 com duas notas curtas no 1.\xBA tempo (pontuado ou colcheias) e um acento longo no 2.\xBA ou no 3.\xBA tempo.",en:"3/4 with two short notes on beat 1 (dotted or eighths) and a long accent on beat 2 or 3."},"style.polonaise":{pt:"Polonesa",en:"Polonaise"},"style.polonaise.desc":{pt:"3/4 moderado com colcheia + duas semicolcheias no 1.\xBA tempo e final \xABfeminino\xBB no 2.\xBA tempo.",en:"Moderate 3/4 with eighth + two sixteenths on beat 1 and a \u201Cfeminine\u201D ending on beat 2."},"style.tarantella":{pt:"Tarantela",en:"Tarantella"},"style.tarantella.desc":{pt:"6/8 muito r\xE1pido, colcheias cont\xEDnuas sem pausas, em geral em menor.",en:"Very fast 6/8, continuous eighths without rests, usually in minor."},"style.vira":{pt:"Vira (Minho)",en:"Vira (Minho)"},"style.vira.desc":{pt:"6/8 vivo, como uma valsa r\xE1pida: sem\xEDnima + colcheia e tr\xEAs colcheias, frases de 4 compassos repetidas.",en:"Lively 6/8, like a fast waltz: quarter + eighth and three eighths, repeated 4-bar phrases."},"style.habanera":{pt:"Habanera / tango",en:"Habanera / tango"},"style.habanera.desc":{pt:"2/4 com a figura colcheia pontuada + semicolcheia no 1.\xBA tempo, a \xABs\xEDncopa\xBB semicolcheia\u2013colcheia\u2013semicolcheia e notas que atravessam o tempo.",en:"2/4 with the dotted eighth + sixteenth figure on beat 1, the \u201Cs\xEDncopa\u201D sixteenth\u2013eighth\u2013sixteenth and notes that cross the beat."},"style.palestrina":{pt:"Polifonia do s\xE9c. XVI (Palestrina)",en:"16th-century polyphony (Palestrina)"},"style.palestrina.desc":{pt:"M\xEDnimas e sem\xEDnimas, graus conjuntos, sem 7.as nem tr\xEDtonos, saltos grandes compensados por grau, um s\xF3 cl\xEDmax, \xE2mbito de uma 9.\xAA ou 10.\xAA (Jeppesen; Fux).",en:"Half and quarter notes, stepwise motion, no sevenths or tritones, large leaps compensated by step, a single climax, a range of a 9th or 10th (Jeppesen; Fux)."},"style.chorale":{pt:"Coral (Bach)",en:"Chorale (Bach)"},"style.chorale.desc":{pt:"Uma nota por tempo (sem\xEDnimas), graus conjuntos, poucos saltos grandes, fra :{pt:", transpostas {s} semitons para a tonalidade escolhida",en:", transposed {s} semitones to the chosen key"},"blocks.summary":{pt:"Padr\xF5es do corpus: figuras e liga\xE7\xF5es por compasso",en:"Corpus patterns: figures and links by time signature"},"blocks.hint":{pt:"Aprendidos com 9644 melodias reais (Essen, Aird\u2019s Airs, O\u2019Neill, Ryan\u2019s Mammoth, sopranos de Bach), separadas por compasso, sem as 480 do cr\xEDtico. Um bloco \xE9 um tempo \u2014 uma sem\xEDnima nos compassos simples, uma sem\xEDnima com ponto (tr\xEAs colcheias) nos compostos: a figura r\xEDtmica, o contorno em graus da escala e o intervalo de entrada. O gerador usa-os na popula\xE7\xE3o inicial (\xABBlocos do corpus\xBB), numa muta\xE7\xE3o e na regra \xABIdioma do corpus\xBB (nos pesos; a 0 por omiss\xE3o). Mostra o compasso escolhido em Compor.",en:"Learned from 9,644 real melodies (Essen, Aird\u2019s Airs, O\u2019Neill, Ryan\u2019s Mammoth, Bach sopranos), separated by time signature, without the critic\u2019s 480. A block is a beat \u2014 a quarter note in simple meters, a dotted quarter (three eighths) in compound ones: the rhythmic figure, the contour in scale degrees and the entry interval. The generator uses them in the initial population (\u201CCorpus blocks\u201D), in a mutation and in the rule \u201CCorpus idiom\u201D (in the weights; 0 by default). It shows the meter chosen in Compose."},"blocks.noData":{pt:"Sem dados para este compasso.",en:"No data for this meter."},"blocks.top":{pt:"Figuras de um tempo mais comuns em {meter}",en:"Most common one-beat figures in {meter}"},"blocks.col.figure":{pt:"figura (s\xEDlabas Takadimi)",en:"figure (Takadimi syllables)"},"blocks.col.share":{pt:"dos tempos",en:"of the beats"},"blocks.after":{pt:"Depois desta figura, no 2.\xBA tempo (1 passo)",en:"After this figure, on beat 2 (1 step)"},"blocks.col.fig":{pt:"figura",en:"figure"},"blocks.col.next":{pt:"seguintes mais prov\xE1veis",en:"most likely next"},"blocks.dir":{pt:"A dire\xE
